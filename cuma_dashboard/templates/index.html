<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CUMA · Indicadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Gramática de Corbatul Twin: una sola página, mapa a la izquierda (menú por familia, tarjetas bento que se agrandan
   y se reacomodan), ficha a la derecha y carpetas de datos. Paleta de Corbatul (verdes y grises); las tarjetas toman el color de su estado y paneles de vidrio 100 % transparentes. */
:root{
  --bg:#fdfdfd; --surface:#f8f8f8; --surface2:#efefef; --ink:#2c2c2e; --ink-strong:#111111;
  --muted:#6b6b70; --line:#e1e1e3; --line-soft:#ededef; --accent:#34c759; --accent-soft:#e3f8e8; --neg:#ff3b30;
  --chart:#34c759; --chart-2:#c4c4c8; --chart-3:#ff9500;
  --ok:#34c759; --warn:#ffcc00; --bad:#ff3b30; --na:#a3a3a8;
  --ok-halo:rgba(52,199,89,.22); --warn-halo:rgba(255,204,0,.28); --bad-halo:rgba(255,59,48,.2); --na-halo:rgba(142,142,147,.2);
  --dedge:rgba(0,0,0,.12); --dglass:transparent; --dscrim:rgba(253,253,253,.18);
  --glass-flat:rgba(0,0,0,.055); --glass-hi:rgba(255,255,255,.95); --glass-shadow:rgba(0,0,0,.22);
  --gold:#34c759; --c1:#34c759; --c2:#00c7be; --c3:#ff9500; --c4:#8e8e93; --c5:#66d4cf; --c6:#e5e5ea;
  --blob-a:rgba(52,199,89,.10); --blob-b:rgba(0,0,0,.035); --blob-c:rgba(0,199,190,.08); --blob-d:rgba(52,199,89,.06);
  --brand:#58585e; --logo-letra:#ff3b30; --logo-hoja:#34c759;
  --rim-hi:rgba(0,0,0,.24); --rim-mid:rgba(0,0,0,.14); --rim-lo:rgba(0,0,0,.05); --ripple:rgba(0,0,0,.12);
  --lens:linear-gradient(180deg,#fff,rgba(255,255,255,.72));
  --lens-shadow:inset 0 1px 1px #fff,inset 0 -2px 5px rgba(255,255,255,.6),inset 0 0 0 .5px rgba(0,0,0,.06),0 8px 18px -8px rgba(20,22,30,.38),0 1px 2px rgba(20,22,30,.14);
  --depth:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -14px 26px -18px rgba(20,22,30,.12);
  --float:0 1px 2px rgba(20,22,30,.06),0 14px 30px -18px rgba(20,22,30,.3);
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.32,.72,0,1);
  --expo:cubic-bezier(.16,1,.3,1); --out3:cubic-bezier(.215,.61,.355,1);
  --font:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09090b; --surface:#141415; --surface2:#1c1c1e; --ink:#cfcfd3; --ink-strong:#f5f5f7;
  --muted:#9a9aa0; --line:rgba(255,255,255,.12); --line-soft:rgba(255,255,255,.07); --accent:#30d158; --accent-soft:#0f2a17; --neg:#ff453a;
  --chart:#30d158; --chart-2:rgba(255,255,255,.16); --chart-3:#ff9f0a;
  --ok:#30d158; --warn:#ffd60a; --bad:#ff453a; --na:#5c5c62;
  --ok-halo:rgba(48,209,88,.24); --warn-halo:rgba(255,214,10,.22); --bad-halo:rgba(255,69,58,.24); --na-halo:rgba(142,142,147,.22);
  --dedge:rgba(255,255,255,.16); --dglass:transparent; --dscrim:rgba(8,8,10,.22);
  --glass-flat:rgba(255,255,255,.07); --glass-hi:rgba(255,255,255,.18); --glass-shadow:rgba(0,0,0,.6);
  --gold:#30d158; --c1:#30d158; --c2:#63e6e2; --c3:#ff9f0a; --c4:#8e8e93; --c5:#66d4cf; --c6:#3a3a3c;
  --blob-a:rgba(48,209,88,.10); --blob-b:rgba(255,255,255,.035); --blob-c:rgba(99,230,226,.06); --blob-d:rgba(48,209,88,.06);
  --brand:#d8d8da; --logo-letra:#ff453a; --logo-hoja:#30d158;
  --rim-hi:rgba(255,255,255,.8); --rim-mid:rgba(255,255,255,.42); --rim-lo:rgba(255,255,255,.11); --ripple:rgba(255,255,255,.45);
  --lens:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.11));
  --lens-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -2px 5px rgba(255,255,255,.12),inset 0 0 0 .5px rgba(255,255,255,.3),0 8px 18px -8px rgba(0,0,0,.6);
  --depth:inset 0 1px 1px rgba(255,255,255,.28),inset 0 -16px 28px -18px rgba(0,0,0,.45);
  --float:0 1px 2px rgba(0,0,0,.3),0 18px 36px -20px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090b; --surface:#141415; --surface2:#1c1c1e; --ink:#cfcfd3; --ink-strong:#f5f5f7;
  --muted:#9a9aa0; --line:rgba(255,255,255,.12); --line-soft:rgba(255,255,255,.07); --accent:#30d158; --accent-soft:#0f2a17; --neg:#ff453a;
  --chart:#30d158; --chart-2:rgba(255,255,255,.16); --chart-3:#ff9f0a;
  --ok:#30d158; --warn:#ffd60a; --bad:#ff453a; --na:#5c5c62;
  --ok-halo:rgba(48,209,88,.24); --warn-halo:rgba(255,214,10,.22); --bad-halo:rgba(255,69,58,.24); --na-halo:rgba(142,142,147,.22);
  --dedge:rgba(255,255,255,.16); --dglass:transparent; --dscrim:rgba(8,8,10,.22);
  --glass-flat:rgba(255,255,255,.07); --glass-hi:rgba(255,255,255,.18); --glass-shadow:rgba(0,0,0,.6);
  --gold:#30d158; --c1:#30d158; --c2:#63e6e2; --c3:#ff9f0a; --c4:#8e8e93; --c5:#66d4cf; --c6:#3a3a3c;
  --blob-a:rgba(48,209,88,.10); --blob-b:rgba(255,255,255,.035); --blob-c:rgba(99,230,226,.06); --blob-d:rgba(48,209,88,.06);
  --brand:#d8d8da; --logo-letra:#ff453a; --logo-hoja:#30d158;
  --rim-hi:rgba(255,255,255,.8); --rim-mid:rgba(255,255,255,.42); --rim-lo:rgba(255,255,255,.11); --ripple:rgba(255,255,255,.45);
  --lens:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.11));
  --lens-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -2px 5px rgba(255,255,255,.12),inset 0 0 0 .5px rgba(255,255,255,.3),0 8px 18px -8px rgba(0,0,0,.6);
  --depth:inset 0 1px 1px rgba(255,255,255,.28),inset 0 -16px 28px -18px rgba(0,0,0,.45);
  --float:0 1px 2px rgba(0,0,0,.3),0 18px 36px -20px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:-10vmax;z-index:-1;pointer-events:none;
  background:radial-gradient(34vmax 30vmax at 6% 12%,var(--blob-a),transparent 70%),
             radial-gradient(38vmax 32vmax at 52% 0%,var(--blob-b),transparent 70%),
             radial-gradient(36vmax 30vmax at 98% 30%,var(--blob-c),transparent 70%),
             radial-gradient(40vmax 34vmax at 70% 104%,var(--blob-d),transparent 70%),
             radial-gradient(34vmax 30vmax at 12% 100%,var(--blob-b),transparent 70%)}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{height:100dvh;max-width:1520px;margin-inline:auto;display:grid;grid-template-rows:auto minmax(0,1fr);gap:22px;
  padding:clamp(18px,2.6vw,36px) clamp(16px,4vw,48px) clamp(16px,2.4vw,28px)}

/* ---------- cabecera (como OMEGA · Corbatul Twin) ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 28px;min-width:0}
.top .ttl{line-height:0}
.ttl{--om:clamp(2.1rem,4.2vw,2.8rem);margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.t-cuma .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.t-cuma .ch{display:inline-block}
.t-cuma{padding:.04em .02em .04em 0;font-size:var(--om);font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;color:var(--ink-strong);font-family:'Playfair Display','Didot','Bodoni 72',Georgia,serif}
.logo{display:block;height:calc(var(--om)*1.45);width:auto;color:var(--ink-strong);flex:none;align-self:center}
.t-stack{display:flex;flex-direction:column;justify-content:center;gap:2px;position:relative;padding-left:12px;font-size:clamp(.7rem,1.2vw,.82rem)}
.t-stack::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);height:calc(var(--om)*.72);width:1.5px;background:color-mix(in srgb,var(--muted) 55%,transparent)}
.t-main{font-weight:700;letter-spacing:.14em;text-transform:uppercase;line-height:1.3;color:var(--ink-strong)}
.t-sub{font-weight:600;letter-spacing:.14em;text-transform:uppercase;line-height:1.3;color:var(--muted)}
.toprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}

/* ---------- menús con resaltado deslizante ---------- */
/* píldora de vidrio con canto de luz y lente elástica (gramática de Vitrea) */
.rsel,.mtop .gb,.hm-mode{border-radius:999px;background:var(--glass-flat);-webkit-backdrop-filter:blur(12px) saturate(150%);backdrop-filter:blur(12px) saturate(150%);
  box-shadow:inset 1px 1px 0 -.25px var(--rim-hi),inset -1px -1px 0 -.25px var(--rim-mid),inset 0 0 0 1px var(--rim-lo),var(--float)}
.rsel{position:relative;display:flex;align-items:center;gap:4px;padding:4px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none;isolation:isolate}
.rsel::-webkit-scrollbar{display:none}
.rsel>span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 8px 0 10px;white-space:nowrap}
.rsel button{position:relative;z-index:1;border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:baseline;gap:6px;white-space:nowrap;transition:color .3s,background-color .2s}
.rsel button small{font-size:11px;font-weight:500;color:var(--muted)}
.rsel button:hover,.rsel button[aria-pressed="true"]{color:var(--ink-strong)}
.gb,.il{position:relative;display:flex;flex-wrap:nowrap;justify-content:center;gap:3px;padding:4px;isolation:isolate;max-width:100%;overflow-x:auto;scrollbar-width:none}
.gb::-webkit-scrollbar,.il::-webkit-scrollbar{display:none}
.gb button,.il button{appearance:none;margin:0;position:relative;z-index:1;cursor:pointer;background:transparent;border:0;border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:600;color:#3b3b3e;white-space:nowrap;transition:color .45s var(--spring),background-color .2s}
:root[data-theme="dark"] .gb button,:root[data-theme="dark"] .il button{color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gb button,:root:not([data-theme="light"]) .il button{color:var(--muted)}}
.gb button:hover,.il button:hover,.gb button[aria-pressed="true"],.il button[aria-pressed="true"]{color:var(--ink-strong)}
.rsel button:not([aria-pressed="true"]):hover,.gb button:not([aria-pressed="true"]):hover,.il button:not([aria-pressed="true"]):hover{background:var(--glass-flat)}
/* lente: los bordes izquierdo y derecho viajan a ritmos distintos y al llegar rebota como gelatina */
.hl{position:absolute;left:0;top:0;z-index:0;pointer-events:none;opacity:0;border-radius:999px;background:var(--lens);box-shadow:var(--lens-shadow);transition:opacity .3s;will-change:left,width,transform}
.hl.on{opacity:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn{position:relative;width:34px;height:34px;flex:none;border-radius:50%;border:0;display:grid;place-items:center;background:var(--glass-flat);color:var(--ink-strong);cursor:pointer;transition:background .2s;
  box-shadow:inset 1px 1px 0 -.25px var(--rim-hi),inset -1px -1px 0 -.25px var(--rim-mid),inset 0 0 0 1px var(--rim-lo),var(--float)}
.icon-btn:hover{background:var(--line)}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- escenario ---------- */
.stage{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:24px;min-height:0}
.dbody{display:flex;flex-direction:column;gap:12px;min-width:0}
.deck .dstack{margin-top:10px}
/* mapa de calor día × hora */
.hm-mode{padding:3px}
.hm-mode button{padding:5px 12px;font-size:11.5px;text-transform:none;letter-spacing:0}
.hm{display:grid;grid-template-columns:30px repeat(14,minmax(0,1fr)) 58px;gap:4px;align-items:center;margin-top:4px}
.hm .hh{font-size:10px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.hm .hh:last-child{text-align:right}
.hm .rl{font-size:11px;font-weight:600;color:var(--muted)}
.hm .c{position:relative;height:30px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;cursor:pointer;
  transition:transform .35s var(--spring),box-shadow .3s;animation:hmIn .5s var(--ease) backwards;animation-delay:calc(var(--k,0)*6ms)}
.hm .c.hi{color:#fff}
.hm .c.pk{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ok)}
.hm .c:hover{transform:scale(1.14);z-index:2;box-shadow:0 8px 18px -8px var(--glass-shadow)}
.hm .c.off{cursor:default;background:repeating-linear-gradient(135deg,var(--glass-flat) 0 3px,transparent 3px 7px)}
.hm .c.off:hover{transform:none;box-shadow:none}
.hm .tt{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-strong);text-align:right}
@keyframes hmIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.hm-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.hm-info{font-size:12px;color:var(--ink);min-height:18px}
.hm-lg{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted)}
.hm-lg em{font-style:normal}
.hm-lg i{display:block;width:90px;height:8px;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--ok) 8%,transparent),var(--ok))}
.glass{position:relative;-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);box-shadow:var(--depth),0 30px 60px -40px var(--glass-shadow);
  background:transparent;border:0;border-radius:18px}
/* canto de luz de las tarjetas: un degradado cónico enmascarado que solo deja ver 1,25 px del borde */
.glass::before,.tile::before,.dc::before,.dli::before,.cg::before{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;pointer-events:none;padding:1.25px;
  background:conic-gradient(from 300deg,var(--rim-hi) 0deg,var(--rim-lo) 55deg,transparent 90deg,var(--rim-lo) 140deg,var(--rim-mid) 180deg,var(--rim-lo) 220deg,transparent 270deg,var(--rim-lo) 315deg,var(--rim-hi) 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.tile.more::before{display:none}
/* ondas al tocar */
.ripple-wrap{position:absolute;inset:0;z-index:2;border-radius:inherit;overflow:hidden;pointer-events:none}
.ripple{position:absolute;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,transparent 38%,var(--rip,var(--ripple)) 62%,transparent 72%)}
.map{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.mtop{position:relative;display:flex;justify-content:center;align-items:center;padding:14px 34px 10px}
.mtop .gb{min-width:0;transition:transform .45s var(--spring)}
.mtop .gb button{padding:8px 10px}
.dtoggle{position:relative;box-shadow:inset 1px 1px 0 -.25px var(--rim-hi),inset -1px -1px 0 -.25px var(--rim-mid),inset 0 0 0 1px var(--rim-lo),var(--float);appearance:none;display:inline-flex;align-items:center;gap:7px;margin:0;height:34px;padding:0 14px 0 11px;border:0;border-radius:999px;background:var(--glass-flat);color:var(--ink-strong);font-size:12.5px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.dtoggle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dtoggle:hover{background:var(--line)}
.dtoggle[aria-expanded="true"]{background:var(--ink-strong);color:var(--bg)}
.dot{--c:var(--na);--h:var(--na-halo);position:relative;flex:none;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--h);transition:background-color .3s,box-shadow .3s}
.dot::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);opacity:0;animation:breath 3.4s cubic-bezier(.45,0,.25,1) infinite}
.dot.ok{--c:var(--ok);--h:var(--ok-halo)}.dot.warn{--c:var(--warn);--h:var(--warn-halo)}.dot.bad{--c:var(--bad);--h:var(--bad-halo)}
.dot.na::before{display:none}
.dot.sm{width:7px;height:7px;box-shadow:0 0 0 2px var(--h)}.dot.sm::before{display:none}
@keyframes breath{0%,100%{transform:scale(1);opacity:0}18%{opacity:.38}55%{transform:scale(2.5);opacity:0}}
.mtop>.dot{position:absolute;right:16px;top:50%;margin-top:-3px}

.mbody{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.view{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin;padding:2px 16px 14px;transition:filter .6s var(--ease)}
.mbody.dk .view{filter:blur(9px)}
.il{border-top:1px solid var(--line);padding:8px 12px;justify-content:flex-start;transition:filter .6s var(--ease),opacity .3s}
.map.dk .il{filter:blur(9px);pointer-events:none}

/* ---------- rejilla bento: la tarjeta tocada se agranda y el resto se reacomoda (FLIP) ---------- */
.bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(104px,auto);grid-auto-flow:row dense;gap:8px}
.tile{appearance:none;position:relative;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:0;text-align:left;cursor:pointer;overflow:hidden;
  padding:12px 13px 11px;border-radius:16px;border:0;background:transparent;transform-origin:0 0;
  transition:background .3s,border-color .3s,box-shadow .35s}
.tile{--st:var(--na);--chart:var(--st);background:color-mix(in srgb,var(--st) 7%,transparent);box-shadow:var(--depth);
  --rim-hi:color-mix(in srgb,var(--st) 85%,transparent);--rim-mid:color-mix(in srgb,var(--st) 50%,transparent);--rim-lo:color-mix(in srgb,var(--st) 18%,transparent);--rip:color-mix(in srgb,var(--st) 40%,transparent)}
.tile[data-st="ok"]{--st:var(--ok)}.tile[data-st="warn"]{--st:var(--warn)}.tile[data-st="bad"]{--st:var(--bad)}
.tile[data-st="na"]{--st:var(--muted);background:transparent}
.tile:hover{background:color-mix(in srgb,var(--st) 12%,transparent)}
.tile .t-id{display:flex;align-items:center;gap:6px}
.tile .t-st{font-family:var(--font);font-size:10px;font-weight:600;letter-spacing:0;color:color-mix(in srgb,var(--st) 75%,var(--ink-strong))}
.tile.big{grid-column:span 2;grid-row:span 2;background:color-mix(in srgb,var(--st) 10%,transparent);box-shadow:var(--depth),0 0 0 1px color-mix(in srgb,var(--st) 14%,transparent),0 20px 40px -26px var(--st);padding:15px 17px 13px;
  --rim-hi:var(--st);--rim-mid:color-mix(in srgb,var(--st) 70%,transparent);--rim-lo:color-mix(in srgb,var(--st) 30%,transparent)}
.tile .t-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tile .t-id{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted)}
.tile .t-n{font-size:12px;font-weight:600;color:var(--ink);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .t-v{font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--ink-strong);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tile .t-v.txt{font-size:15px;font-weight:600;color:var(--muted)}
.tile .t-v small{font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted);margin-left:6px}

    <path d="${d}L${pts[pts.length - 1][0]} ${H}L${pts[0][0]} ${H}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="var(--chart)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${ys[si] == null ? '' : `<circle cx="${xs[si]}" cy="${ys[si]}" r="3" fill="var(--surface)" stroke="var(--chart)" stroke-width="1.8" vector-effect="non-scaling-stroke"/>`}</svg>`;
}
function slide(nav, instant) {

  const to = [b.offsetLeft, b.offsetLeft + b.offsetWidth], from = hl._cur;
  const put = (a, z) => { hl._cur = [a, z]; hl.style.left = a + 'px'; hl.style.width = (z - a) + 'px'; };
  cancelAnimationFrame(hl._raf);
  hl.style.top = b.offsetTop + 'px'; hl.style.height = b.offsetHeight + 'px';
  if (instant || !from || !hl.classList.contains('on') || reduce()) put(...to);
  else if (from[0] !== to[0] || from[1] !== to[1]) {

    const step = now => {

      if (t < 550) hl._raf = requestAnimationFrame(step);

      {transform: 'scale(1.005,1.03)', offset: .6}, {transform: 'scale(1,.99)', offset: .8}, {transform: 'none'}], {duration: 900, easing: 'ease-out'});
  }
  hl.classList.add('on');

  if (l < 0 || l + b.offsetWidth > nav.clientWidth) nav.scrollTo({left: b.offsetLeft - 24, behavior: 'smooth'});
}

function drawHeat(m) {
  const H = D.mapa, DIAS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'], DL = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
  const M = H[m], all = M.flat().filter(v => v != null), max = Math.max(...all);
  const fmt = v => m === 'v' ? usd(v) : nf(v, 1), cell = v => m === 'v' ? nf(v, 0) : nf(v, 1);
  const unit = m === 'v' ? 'en ventas' : 'transacciones';
  let pk = [0, 0]; M.forEach((r, d) => r.forEach((v, j) => { if (v != null && v > M[pk[0]][pk[1]]) pk = [d, j]; }));
  let html = '<span></span>' + H.horas.map(x => `<span class="hh">${x}</span>`).join('') + '<span class="hh">Día</span>';
  M.forEach((r, d) => {
    html += `<span class="rl">${DIAS[d]}</span>`;
    r.forEach((v, j) => {
      if (v == null) { html += `<span class="c off" data-d="${d}" data-j="${j}"></span>`; return; }
      const a = v / max, p = Math.round(8 + a * 92);
      html += `<span class="c ${a > .55 ? 'hi' : ''} ${d === pk[0] && j === pk[1] ? 'pk' : ''}" style="--k:${d * 14 + j};background:color-mix(in srgb,var(--ok) ${p}%,transparent)" data-d="${d}" data-j="${j}">${a > .12 ? cell(v) : ''}</span>`;
    });
    html += `<span class="tt">${fmt(r.reduce((s, v) => s + (v || 0), 0))}</span>`;
  });
  const el = $('hm'); if (!el) return;
  el.innerHTML = html;
  const info = $('hm-info'), base = `Pico: ${DL[pk[0]]} a las ${H.horas[pk[1]]}:00, ${fmt(M[pk[0]][pk[1]])} ${unit}`;
  info.textContent = base;
  el.querySelectorAll('.c').forEach(c => {
    c.onmouseenter = () => { const d = +c.dataset.d, j = +c.dataset.j, v = M[d][j];
      info.textContent = v == null ? `${cap(DL[d])} a las ${H.horas[j]}:00: cerrado` : `${cap(DL[d])} de ${H.horas[j]}:00 a ${H.horas[j]}:59: ${fmt(v)} ${unit} · ${m === 'v' ? nf(H.t[d][j], 1) + ' transacciones' : usd(H.v[d][j]) + ' en ventas'}`; };
    c.onmouseleave = () => { info.textContent = base; };
    c.onclick = c.onmouseenter;
  });
}
function cardInventario(db) {
  const inv = D.inventario, A = D.ajustes, T = D.ajustes_total;
  db.innerHTML = `<div style="overflow-x:auto"><table class="dt-tbl"><thead><tr><th>Inventario contado al costo</th>${inv.conteos.map(c => `<th>${c} 2026</th>`).join('')}</tr></thead><tbody>
    ${inv.areas.map(a => `<tr><td>${a.area}</td>${a.v.map(v => `<td>${nf(v)}</td>`).join('')}</tr>`).join('')}
    <tr class="tot"><td>Total</td>${inv.total.map(v => `<td>${nf(v)}</td>`).join('')}</tr></tbody></table></div>
    <div class="cgs" style="margin-top:12px"><div class="cg"><h4>Rotación y margen sobre inventario · may – sep</h4><div class="tl x4">
      <div><span>Inventario promedio</span><b>${usd(inv.promedio)}</b><em>abril y septiembre</em></div>
      <div><span>Costo de ventas</span><b>${usd(inv.costo_may_sep)}</b><em>mayo a septiembre</em></div>
      <div><span>Rotación (I13)</span><b>${nf(inv.rot_anual, 1)} al año</b><em>${inv.dias} días de inventario</em></div>
      <div><span>GMROI (I14)</span><b>${nf(inv.gmroi_anual, 2)} al año</b><em>referencia 1</em></div></div></div></div>
    <div style="overflow-x:auto;margin-top:12px"><table class="dt-tbl"><thead><tr><th>Ajuste neto · mar – sep</th><th>Ajuste</th><th>Ventas</th><th>Ajuste / ventas</th></tr></thead><tbody>
    ${A.map((a, k) => `<tr class="${k === 1 ? 'sel' : ''}"><td>${a.area}</td><td class="neg">${nf(a.aj)}</td><td>${nf(a.ventas)}</td><td class="neg">${pct(a.pct)}</td></tr>`).join('')}
    <tr class="tot"><td>Total</td><td class="neg">${nf(T.aj)}</td><td>${nf(T.ventas)}</td><td class="neg">${pct(T.pct)}</td></tr></tbody></table></div>
    <p class="cap">Conteos completos el 9 de enero, el 30 de abril y el 30 de septiembre de 2026. Ajuste neto: faltantes menos sobrantes, al costo. El de frutas y hortalizas (7,5 %) se usa como aproximación de la merma (I15) y explica unos 2,5 puntos del margen bruto; el de granos a granel refleja el reempaque, no merma. Se excluye un registro de 1.444 kg de cebolla perla del 30 de abril, corregido el 4 de mayo.</p>`;
}
function cardPareto(db) {
  const P = D.pareto;
  db.innerHTML = `<div class="dfit"><table class="dt-tbl"><thead><tr><th>% de productos</th><th>% de ventas</th></tr></thead><tbody>
    ${P.x.slice(1).map((x, k) => `<tr class="${x === 20 ? 'sel' : ''}"><td>${x} %</td><td>${pct(P.y[k + 1])}</td></tr>`).join('')}</tbody></table>
    <div class="cgs"><div class="cg"><h4>Curva de Pareto · dic – sep</h4><div class="chart" style="height:170px"><canvas id="d1"></canvas></div></div>
    <div class="cg"><h4>Clases</h4><div class="tl x4" style="grid-template-columns:repeat(3,1fr)">${[['A', 'hasta 80 %'], ['B', '80 – 95 %'], ['C', 'último 5 %']].map(([c, s]) => `<div><span>Clase ${c}</span><b>${nf(P.abc[c])}</b><em>${s}</em></div>`).join('')}</div></div></div></div>`;
  pareto('d1');
}
function cardCobertura(db) {
  const cb = D.cobertura, tot = cb.completos + cb.parciales + cb.sin_datos;
  db.innerHTML = `<table class="dt-tbl"><thead><tr><th>Cobertura por familia</th><th>Completos</th><th>Parciales</th><th>Sin datos</th></tr></thead><tbody>
    ${['C', 'F', 'O', 'A'].map(f => { const it = IND.filter(i => i.f === f), c = e => it.filter(i => i.e === e).length; return `<tr><td>${FAM_L[f]}</td><td>${c('full')}</td><td>${c('part')}</td><td>${c('none')}</td></tr>`; }).join('')}
    <tr class="tot"><td>Total</td><td>${cb.completos}</td><td>${cb.parciales}</td><td>${cb.sin_datos}</td></tr></tbody></table>
    <p class="cap">Con base para calcular: ${cb.completos + cb.parciales} de ${tot} indicadores (${nf((cb.completos + cb.parciales) / tot * 100, 0)} %) y el ${cb.tablero_pct} % del tablero principal (${cb.tablero_completos} completos y ${TABLERO.length - cb.tablero_completos} parciales). El tablero sustituye la cobertura de caja (I10) y la velocidad de pago (I19), que dependen de la tesorería centralizada, por el margen operativo (I3) y la concentración de compras (I20).</p>`;
}
function cardFaltan(db) {
  const PR = {a: 'Alta', m: 'Media', b: 'Baja'}, CK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  db.innerHTML = `<div style="overflow-x:auto"><table class="dt-tbl"><thead><tr><th></th><th style="text-align:left">Dato que falta</th><th>Indicadores</th><th>Prioridad</th><th style="text-align:left">Probabilidad de obtenerlo</th></tr></thead><tbody>
    ${D.faltan.map((f, i) => `<tr class="${HECHOS.has(i) ? 'done' : ''}"><td style="width:28px"><button class="chk" data-i="${i}" role="checkbox" aria-checked="${HECHOS.has(i)}" aria-label="Recibido">${CK}</button></td><td class="w">${f[0]}<div style="font-size:11px;color:var(--muted);text-decoration:none">${f[3]}</div></td><td>${f[1]}</td><td><span class="prio ${f[2]}">${PR[f[2]]}</span></td><td class="w">${f[4]}</td></tr>`).join('')}</tbody></table></div>
    <p class="cap">Marca cada dato cuando llegue; la marca se guarda solo en este navegador. Los datos de tesorería (caja, bancos, cuentas por cobrar y por pagar, fechas de pago) no se incluyen porque no se separan por tienda.</p>`;
  const fi = TARJETAS.findIndex(c => c.b === cardFaltan);
  db.querySelectorAll('.chk').forEach(b => b.onclick = () => {
    const i = +b.dataset.i; HECHOS.has(i) ? HECHOS.delete(i) : HECHOS.add(i);
    try { localStorage.setItem(HKEY, JSON.stringify([...HECHOS])); } catch (e) {}
    b.setAttribute('aria-checked', HECHOS.has(i)); b.closest('tr').classList.toggle('done', HECHOS.has(i));
    const s = $('deck').querySelector(`.dli[data-i="${fi}"] .dls`); if (s) s.textContent = TARJETAS[fi].s();
  });
}
function cardUmbrales(db) {
  db.innerHTML = `<table class="dt-tbl"><thead><tr><th>Indicador</th><th style="text-align:left">Umbral</th><th>Valor</th><th>Semáforo</th></tr></thead><tbody>
    ${TABLERO.map(id => `<tr><td>${id} · ${BY[id].c}</td><td class="w">${U[id] ? U[id].txt : 'Por calibrar'}</td><td>${V[id].v}</td><td><span style="display:inline-flex"><span class="dot sm ${V[id].st}"></span></span></td></tr>`).join('')}</tbody></table>
    <p class="cap">Umbrales provisionales, por calibrar con las metas institucionales: margen de las otras tiendas y meta del gerente cerca de 18 %, autosuficiencia plena en 100 %, merma aceptable hasta 5 % y concentración moderada hasta 2.500 puntos.</p>`;
}

/* ---------- periodo ---------- */
function refresh() {
  compute(); renderBento(false);
  if (S.datos) deckList();
  swap($('pin'), renderPanel);
}
function buildMes() {
  const items = [['acum', `${perCorto()}<small>2026</small>`], ...PER.map(k => [k, lbl(k)])];
  menu($('mes'), items, S.mes, v => { S.mes = v; refresh(); }, '<span>Periodo</span>');
}
function setInicio(k) {
  PER = D.meses.slice(ix(k));
  if (S.mes !== 'acum' && !PER.includes(S.mes)) S.mes = 'acum';
  buildMes(); refresh();
}

/* ---------- arranque y eventos ---------- */
buildMes();
menu($('fam'), Object.entries(FAM), S.fam, v => {
  if (S.datos) closeDatos(false);
  S.fam = v; S.sel = null; S.todos = false;
  renderBento(); renderSub(); swap($('pin'), renderPanel);
});
$('dtoggle').onclick = () => S.datos ? closeDatos() : openDatos();
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.datos) { if (S.card != null) pickCard(null); else closeDatos(); }
  else if (S.sel) pick(null);
});
addEventListener('resize', () => document.querySelectorAll('.rsel,.gb,.il').forEach(n => slide(n, true)));

const THEMES = ['auto', 'light', 'dark'], TL = {auto: 'automático', light: 'claro', dark: 'oscuro'};
let theme = 'auto';
try { theme = localStorage.getItem('cuma-theme') || 'auto'; } catch (e) {}
const applyTheme = () => { if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme; $('theme').title = 'Tema: ' + TL[theme]; };
const repaint = () => { applyTheme(); defaults(); compute(); renderBento(false); if (S.datos) deckList(); renderPanel(); };
$('theme').onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; try { localStorage.setItem('cuma-theme', theme); } catch (e) {} repaint(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (theme === 'auto') repaint(); });

applyTheme(); defaults(); compute(); renderBento(false); renderSub(); renderPanel();

/* entrada de la página: las letras del título suben, los controles caen con rebote y los paneles se abren */
if (!reduce()) {
  const t = document.querySelector('.t-cuma'), txt = t.textContent.trim();
  t.setAttribute('aria-label', txt);
  t.innerHTML = `<span class="w" aria-hidden="true">${[...txt].map(c => `<span class="ch">${c}</span>`).join('')}</span>`;
  t.querySelectorAll('.ch').forEach((c, i) => c.animate([{transform: 'translateY(115%) rotate(6deg)'}, {transform: 'none'}],
    {duration: 850, delay: 80 + i * 22, easing: 'cubic-bezier(.23,1,.32,1)', fill: 'backwards'}));
  [...document.querySelectorAll('.toprow>*')].forEach((c, i) => c.animate([{transform: 'translateY(-70px)', opacity: 0}, {transform: 'none', opacity: 1}],
    {duration: 900, delay: 20 + i * 70, easing: 'cubic-bezier(.34,1.45,.64,1)', fill: 'backwards'}));
  reveal($('map'), 100); reveal($('panel'), 160);
}
})();
</script>
