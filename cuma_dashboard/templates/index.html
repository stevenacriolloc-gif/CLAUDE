<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CUMA · Indicadores</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Gramática de Corbatul Twin: una sola página, mapa a la izquierda (menú por familia, tarjetas bento que se agrandan
   y se reacomodan), ficha a la derecha y carpetas de datos. Paleta de Corbatul (verdes y grises); las tarjetas toman el color de su estado y paneles de vidrio 100 % transparentes. */
:root{
  --bg:#fdfdfd; --surface:#f8f8f8; --surface2:#efefef; --ink:#2c2c2e; --ink-strong:#111111;
  --muted:#6b6b70; --line:#e1e1e3; --line-soft:#ededef; --accent:#2f6b45; --accent-soft:#e8f0eb; --neg:#b0322f;
  --chart:#2f6b45; --chart-2:#c4c4c8; --chart-3:#e55812;
  --ok:#34c759; --warn:#f5b400; --bad:#ff3b30; --na:#a3a3a8;
  --ok-halo:rgba(52,199,89,.22); --warn-halo:rgba(245,180,0,.28); --bad-halo:rgba(255,59,48,.2); --na-halo:rgba(142,142,147,.2);
  --dedge:rgba(0,0,0,.12); --dglass:transparent; --dscrim:rgba(253,253,253,.18);
  --glass-flat:rgba(0,0,0,.055); --glass-hi:rgba(255,255,255,.95); --glass-shadow:rgba(0,0,0,.22);
  --gold:#4d6b1f; --c1:#16b45a; --c2:#95c623; --c3:#e55812; --c4:#5f5f63; --c5:#8fd9ac; --c6:#dcd3c4;
  --blob-a:rgba(47,107,69,.10); --blob-b:rgba(0,0,0,.035); --blob-c:rgba(149,198,35,.08); --blob-d:rgba(47,107,69,.06);
  --brand:#58585e;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.32,.72,0,1);
  --font:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09090b; --surface:#141415; --surface2:#1c1c1e; --ink:#cfcfd3; --ink-strong:#f5f5f7;
  --muted:#9a9aa0; --line:rgba(255,255,255,.12); --line-soft:rgba(255,255,255,.07); --accent:#86c9a0; --accent-soft:#15241b; --neg:#f2928a;
  --chart:#86c9a0; --chart-2:rgba(255,255,255,.16); --chart-3:#f06a26;
  --ok:#30d158; --warn:#ffd60a; --bad:#ff453a; --na:#5c5c62;
  --ok-halo:rgba(48,209,88,.24); --warn-halo:rgba(255,214,10,.22); --bad-halo:rgba(255,69,58,.24); --na-halo:rgba(142,142,147,.22);
  --dedge:rgba(255,255,255,.16); --dglass:transparent; --dscrim:rgba(8,8,10,.22);
  --glass-flat:rgba(255,255,255,.07); --glass-hi:rgba(255,255,255,.18); --glass-shadow:rgba(0,0,0,.6);
  --gold:#a8c75a; --c1:#34e07a; --c2:#a8d63a; --c3:#f06a26; --c4:#9a9a9f; --c5:#7fcf9e; --c6:#2e3a3a;
  --blob-a:rgba(134,201,160,.10); --blob-b:rgba(255,255,255,.035); --blob-c:rgba(168,214,58,.06); --blob-d:rgba(134,201,160,.06);
  --brand:#d8d8da;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090b; --surface:#141415; --surface2:#1c1c1e; --ink:#cfcfd3; --ink-strong:#f5f5f7;
  --muted:#9a9aa0; --line:rgba(255,255,255,.12); --line-soft:rgba(255,255,255,.07); --accent:#86c9a0; --accent-soft:#15241b; --neg:#f2928a;
  --chart:#86c9a0; --chart-2:rgba(255,255,255,.16); --chart-3:#f06a26;
  --ok:#30d158; --warn:#ffd60a; --bad:#ff453a; --na:#5c5c62;
  --ok-halo:rgba(48,209,88,.24); --warn-halo:rgba(255,214,10,.22); --bad-halo:rgba(255,69,58,.24); --na-halo:rgba(142,142,147,.22);
  --dedge:rgba(255,255,255,.16); --dglass:transparent; --dscrim:rgba(8,8,10,.22);
  --glass-flat:rgba(255,255,255,.07); --glass-hi:rgba(255,255,255,.18); --glass-shadow:rgba(0,0,0,.6);
  --gold:#a8c75a; --c1:#34e07a; --c2:#a8d63a; --c3:#f06a26; --c4:#9a9a9f; --c5:#7fcf9e; --c6:#2e3a3a;
  --blob-a:rgba(134,201,160,.10); --blob-b:rgba(255,255,255,.035); --blob-c:rgba(168,214,58,.06); --blob-d:rgba(134,201,160,.06);
  --brand:#d8d8da;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:-10vmax;z-index:-1;pointer-events:none;
  background:radial-gradient(34vmax 30vmax at 6% 12%,var(--blob-a),transparent 70%),
             radial-gradient(38vmax 32vmax at 52% 0%,var(--blob-b),transparent 70%),
             radial-gradient(36vmax 30vmax at 98% 30%,var(--blob-c),transparent 70%),
             radial-gradient(40vmax 34vmax at 70% 104%,var(--blob-d),transparent 70%),
             radial-gradient(34vmax 30vmax at 12% 100%,var(--blob-b),transparent 70%)}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{height:100dvh;max-width:1520px;margin-inline:auto;display:grid;grid-template-rows:auto minmax(0,1fr);gap:22px;
  padding:clamp(18px,2.6vw,36px) clamp(16px,4vw,48px) clamp(16px,2.4vw,28px)}

/* ---------- cabecera (como OMEGA · Corbatul Twin) ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 28px;min-width:0}
.top .ttl{line-height:0}
.ttl{--om:clamp(2.1rem,4.2vw,2.8rem);margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.t-cuma{padding:.04em .02em .04em 0;font-size:var(--om);font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1.1;color:var(--brand);font-family:'High Tower Text','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}
.logo{display:block;height:calc(var(--om)*1.45);width:auto;color:var(--ink-strong);flex:none;align-self:center}
.t-stack{display:flex;flex-direction:column;justify-content:center;gap:2px;position:relative;padding-left:12px;font-size:clamp(.7rem,1.2vw,.82rem)}
.t-stack::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);height:calc(var(--om)*.72);width:1.5px;background:color-mix(in srgb,var(--muted) 55%,transparent)}
.t-main{font-weight:700;letter-spacing:.14em;text-transform:uppercase;line-height:1.3;color:var(--ink-strong)}
.t-sub{font-weight:600;letter-spacing:.14em;text-transform:uppercase;line-height:1.3;color:var(--muted)}
.toprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}

/* ---------- menús con resaltado deslizante ---------- */
.rsel{position:relative;display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:var(--glass-flat);width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none;isolation:isolate}
.rsel::-webkit-scrollbar{display:none}
.rsel>span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 8px 0 10px;white-space:nowrap}
.rsel button{position:relative;z-index:1;border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:baseline;gap:6px;white-space:nowrap;transition:color .3s}
.rsel button small{font-size:11px;font-weight:500;color:var(--muted)}
.rsel button:hover,.rsel button[aria-pressed="true"]{color:var(--ink-strong)}
.rsel .hl{background:var(--surface);box-shadow:0 1px 3px var(--glass-shadow);border-radius:999px}
.gb,.il{position:relative;display:flex;flex-wrap:nowrap;justify-content:center;gap:3px;padding:4px;isolation:isolate;max-width:100%;overflow-x:auto;scrollbar-width:none}
.gb::-webkit-scrollbar,.il::-webkit-scrollbar{display:none}
.gb button,.il button{appearance:none;margin:0;position:relative;z-index:1;cursor:pointer;background:transparent;border:0;border-radius:10px;padding:8px 16px;font-size:12.5px;font-weight:600;color:#3b3b3e;white-space:nowrap;transition:color .45s var(--spring)}
:root[data-theme="dark"] .gb button,:root[data-theme="dark"] .il button{color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gb button,:root:not([data-theme="light"]) .il button{color:var(--muted)}}
.gb button:hover,.il button:hover,.gb button[aria-pressed="true"],.il button[aria-pressed="true"]{color:var(--ink-strong)}
.gb button+button::before,.il button+button::before{content:"";position:absolute;left:-2px;top:28%;bottom:28%;width:1px;background:var(--line);transition:opacity .25s}
.gb button[aria-pressed="true"]::before,.gb button[aria-pressed="true"]+button::before,.il button[aria-pressed="true"]::before,.il button[aria-pressed="true"]+button::before{opacity:0}
.gb .hl,.il .hl{border-radius:10px;background:var(--glass-flat);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
.hl{position:absolute;left:0;top:0;z-index:0;pointer-events:none;opacity:0;will-change:transform,width}
.hl.on{opacity:1}
.hl.anim{transition:transform .55s var(--spring),width .55s var(--spring),height .55s var(--spring),opacity .3s}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn{width:34px;height:34px;flex:none;border-radius:50%;border:0;display:grid;place-items:center;background:var(--glass-flat);color:var(--ink-strong);cursor:pointer;transition:background .2s}
.icon-btn:hover{background:var(--line)}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- escenario ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;min-height:0}
.glass{-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);box-shadow:inset 0 1px 0 var(--glass-hi),0 30px 60px -40px var(--glass-shadow);
  background:transparent;border:1px solid var(--dedge);border-radius:18px}
.map{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.mtop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px 16px;padding:14px 16px}
.mtop .gb{grid-column:2;min-width:0;transition:transform .45s var(--spring)}
.dtoggle{grid-column:1;justify-self:start;appearance:none;display:inline-flex;align-items:center;gap:7px;margin:0;padding:7px 14px 7px 11px;border:0;border-radius:999px;background:var(--glass-flat);color:var(--ink-strong);font-size:12.5px;font-weight:600;cursor:pointer;transition:opacity .3s,transform .45s var(--spring),background .2s}
.dtoggle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dtoggle:hover{background:var(--line)}
.map.dk .dtoggle{opacity:0;transform:scale(.8);pointer-events:none}
.dot{--c:var(--na);--h:var(--na-halo);position:relative;flex:none;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--h);transition:background-color .3s,box-shadow .3s}
.dot::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);opacity:0;animation:breath 3.4s cubic-bezier(.45,0,.25,1) infinite}
.dot.ok{--c:var(--ok);--h:var(--ok-halo)}.dot.warn{--c:var(--warn);--h:var(--warn-halo)}.dot.bad{--c:var(--bad);--h:var(--bad-halo)}
.dot.na::before{display:none}
.dot.sm{width:7px;height:7px;box-shadow:0 0 0 2px var(--h)}.dot.sm::before{display:none}
@keyframes breath{0%,100%{transform:scale(1);opacity:0}18%{opacity:.38}55%{transform:scale(2.5);opacity:0}}
.mtop>.dot{grid-column:3;justify-self:end;margin-right:9px}

.mbody{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.view{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin;padding:2px 16px 14px;transition:filter .6s var(--ease)}
.mbody.dk .view{filter:blur(9px)}
.il{border-top:1px solid var(--line);padding:8px 12px;justify-content:flex-start;transition:filter .6s var(--ease),opacity .3s}
.map.dk .il{filter:blur(9px);pointer-events:none}

/* ---------- rejilla bento: la tarjeta tocada se agranda y el resto se reacomoda (FLIP) ---------- */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(104px,auto);grid-auto-flow:row dense;gap:8px}
.tile{appearance:none;position:relative;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:0;text-align:left;cursor:pointer;overflow:hidden;
  padding:11px 12px 10px;border-radius:16px;border:1px solid var(--dedge);background:transparent;transform-origin:0 0;
  transition:background .3s,border-color .3s,box-shadow .35s}
.tile{--st:var(--na);--chart:var(--st);border-color:color-mix(in srgb,var(--st) 38%,transparent);background:color-mix(in srgb,var(--st) 7%,transparent)}
.tile[data-st="ok"]{--st:var(--ok)}.tile[data-st="warn"]{--st:var(--warn)}.tile[data-st="bad"]{--st:var(--bad)}
.tile[data-st="na"]{--st:var(--muted);border-color:var(--dedge);background:transparent}
.tile:hover{background:color-mix(in srgb,var(--st) 12%,transparent)}
.tile .t-id{display:flex;align-items:center;gap:6px}
.tile .t-st{font-family:var(--font);font-size:10px;font-weight:600;letter-spacing:0;color:color-mix(in srgb,var(--st) 75%,var(--ink-strong))}
.tile.big{grid-column:span 2;grid-row:span 2;background:color-mix(in srgb,var(--st) 10%,transparent);border-color:color-mix(in srgb,var(--st) 60%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--st) 14%,transparent),0 20px 40px -26px var(--st);padding:14px 16px 12px}
.tile .t-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tile .t-id{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted)}
.tile .t-n{font-size:12px;font-weight:600;color:var(--ink);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .t-v{font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--ink-strong);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tile .t-v.txt{font-size:15px;font-weight:600;color:var(--muted)}
.tile .t-v small{font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted);margin-left:6px}
.tile .t-s{font-size:12px;color:var(--muted);line-height:1.4}
.tile .t-viz{margin-top:auto;padding-top:6px;min-height:0}
.tile.big .t-n{font-size:13px;white-space:normal}
.tile.big .t-v{font-size:24px}
.tile.big .t-viz{flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-end}
.tile svg.spark{display:block;width:100%;height:24px;overflow:visible}
.tile.big svg.spark{height:100%;min-height:60px;max-height:150px}
.tile .axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px}
.tile .bar{height:5px;border-radius:99px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.tile .bar i{display:block;height:100%;border-radius:99px;background:var(--chart)}
.tile .bar.void{background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--ink) 10%,transparent) 0 5px,transparent 5px 9px)}
.tile .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tile.more{align-items:flex-start;justify-content:center;border:1px dashed var(--line);background:transparent}
.tile.more .t-v{font-size:20px}
.tile.more:hover{border-color:var(--muted)}
.tile.enter{animation:tileIn .5s var(--ease) both;animation-delay:calc(var(--j,0)*28ms)}
@keyframes tileIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:600;white-space:nowrap}
.tag.full{background:var(--accent-soft);color:var(--accent)}
.tag.part{background:color-mix(in srgb,var(--warn) 18%,transparent);color:color-mix(in srgb,var(--warn) 50%,var(--ink-strong))}
.tag.none{background:var(--glass-flat);color:var(--muted)}
.grp-h{grid-column:1/-1;margin:8px 2px 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:10px}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- baraja de datos (igual que el simulador) ---------- */
.deck{position:absolute;inset:0;z-index:5;overflow:hidden;visibility:hidden;pointer-events:none;transition:visibility 0s .7s}
.deck.open{visibility:visible;pointer-events:auto;transition-delay:0s}
.dscrim{position:absolute;inset:0;background:var(--dscrim);opacity:0;transition:opacity .45s ease}
.deck.open .dscrim{opacity:1}
.dc{position:absolute;left:14px;right:14px;top:calc(100% + 24px);height:calc(100% - 28px);z-index:2;overflow:hidden;
  border:1px solid var(--dedge);border-radius:22px;background:var(--dglass);
  -webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);
  box-shadow:inset 0 1px 0 var(--glass-hi),0 16px 30px -18px var(--glass-shadow);
  opacity:0;transform-origin:50% 0;transform:scale(.94);transition:top .6s var(--ease),transform .6s var(--ease),opacity .35s ease}
.dc.on{top:14px;opacity:1;transform:scale(1)}
.dh{appearance:none;position:relative;z-index:2;display:flex;align-items:center;justify-content:flex-end;width:100%;height:40px;margin:0;padding:0 20px;border:0;background:transparent;cursor:pointer}
.dh::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:1px;background:var(--line)}
.chev{flex:none;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s var(--ease)}
.dh .chev{transform:rotate(90deg)}
.db{position:absolute;left:0;right:0;top:40px;bottom:0;overflow:auto;padding:8px 18px 14px;scrollbar-width:thin;opacity:0;transition:opacity .4s ease .25s}
.dc.on .db{opacity:1}

/* ---------- ficha (panel derecho, como el simulador) ---------- */
.panel{min-width:0;min-height:0;overflow-y:auto;scrollbar-width:thin;padding:24px 28px 26px}
.pin{display:flex;flex-direction:column;gap:18px;transition:opacity .16s ease,transform .16s ease}
.pin.out{opacity:0;transform:translateY(6px)}
.pbar{display:flex;justify-content:space-between;align-items:center}
.pill-btn{appearance:none;display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:7px 14px 7px 11px;background:var(--glass-flat);font-size:12.5px;font-weight:600;color:var(--ink-strong);cursor:pointer;transition:background .2s}
.pill-btn:hover{background:var(--line)}
.pill-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.phead{display:flex;flex-direction:column;gap:6px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.kind{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:8px}
.panel h2{margin:0;font-weight:600;font-size:1.3rem;line-height:1.2;color:var(--ink-strong);text-wrap:balance}
.panel p{margin:0;color:var(--muted)}
.note{padding:10px 13px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:12.5px;line-height:1.45}
.sec{display:flex;flex-direction:column;gap:7px;min-width:0}
.sec h3{margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tbl{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:4px 18px;padding:8px 0;border-top:1px solid var(--line-soft);align-items:baseline}
.row:first-child{border-top:0;padding-top:0}
.row .n{min-width:0;color:var(--muted);font-size:12px;letter-spacing:.01em}
.row .v{min-width:0;font-family:var(--mono);font-size:15px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-strong)}
.row .v.t{font-family:var(--font);font-size:13px;font-weight:400;color:var(--ink);text-align:right}
.row-long{grid-template-columns:1fr;gap:5px}
.row-long .v{text-align:left}
.cgs{display:flex;flex-direction:column;gap:8px}
.cg{background:transparent;border:1px solid var(--dedge);border-radius:16px;padding:10px 12px;min-width:0}
.cg h4{margin:0 0 8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--gold);display:flex;justify-content:space-between;gap:8px;align-items:center}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.lg i.dash{width:12px;height:0;border-radius:0;border-top:2px dashed currentColor;vertical-align:3px}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tl.x4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tl>div{background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:12px;padding:7px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tl span{font-size:10.5px;color:var(--muted)}
.tl b{font-size:15px;font-weight:700;color:var(--ink-strong);letter-spacing:-.01em;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl em{font-style:normal;font-size:11px;color:var(--muted)}
.big{font-size:20px;font-weight:700;color:var(--ink-strong);letter-spacing:-.02em}
.big small{font-size:12px;font-weight:500;color:var(--muted);margin-left:8px;letter-spacing:0}
.pr{margin-top:7px}.pr:first-of-type{margin-top:0}
.pr .l{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink);margin-bottom:3px}
.pr .l b{color:var(--ink-strong);font-weight:600;white-space:nowrap}
.trk{height:6px;border-radius:99px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.trk i{display:block;height:100%;border-radius:99px;background:var(--c);width:calc(var(--w)*100%);transform-origin:left;animation:grow .8s var(--ease) both calc(var(--k,0)*60ms)}
@keyframes grow{from{transform:scaleX(0)}}
.seg{display:flex;gap:3px;height:10px;margin-bottom:8px}
.seg i{flex:1;border-radius:99px;background:var(--c)}
.vbars{display:flex;align-items:flex-end;gap:6px;height:118px}
.vbars>div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.vbars i{display:block;width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:var(--c,var(--chart-2));transform-origin:bottom;animation:growY .8s var(--ease) both calc(var(--k)*50ms)}
.vbars b{font-size:10px;font-weight:600;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.vbars em{font-style:normal;font-size:10px;color:var(--muted)}
@keyframes growY{from{transform:scaleY(0)}}
.chart{position:relative;width:100%}
.formula{padding:14px;border-radius:14px;background:var(--glass-flat);text-align:center;font-family:'Times New Roman',Georgia,serif;font-size:17px;color:var(--ink-strong);overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px}
.fr>span{padding:0 4px}.fr>span:first-child{border-bottom:1px solid currentColor;padding-bottom:2px}.fr>span:last-child{padding-top:2px}
.formula sub,.formula sup{font-size:.62em}
.src{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.src span{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:500;font-family:var(--font);background:var(--glass-flat);color:var(--muted)}
.src span.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.empty-st{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 14px;border-radius:14px;border:1px dashed var(--line);text-align:center;color:var(--muted);font-size:12px}
.switch{appearance:none;position:relative;flex:none;width:44px;height:26px;border-radius:999px;border:0;background:color-mix(in srgb,var(--ink) 22%,transparent);cursor:pointer;transition:background .3s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .45s var(--spring)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* lista de tarjetas de datos en la ficha (igual que el simulador) */
.dstack{position:relative;height:calc(var(--n)*56px + 28px);margin-top:4px}
.dli{appearance:none;position:absolute;left:0;right:0;top:calc(var(--j)*56px);height:84px;z-index:calc(var(--j) + 1);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-content:start;align-items:center;width:100%;text-align:left;padding:14px 18px 0;border:1px solid var(--dedge);border-radius:20px;background:var(--dglass);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);box-shadow:inset 0 1px 0 var(--glass-hi),0 -10px 24px -18px var(--glass-shadow);color:var(--ink);cursor:pointer;font:inherit;transform-origin:50% 0;transform:scale(calc(.94 + var(--j)*.0085));transition:translate .25s ease;animation:dliIn .55s var(--ease) both;animation-delay:calc(var(--j)*45ms)}
@keyframes dliIn{from{opacity:0;transform:translateY(34px) scale(.92)}to{opacity:1;transform:scale(calc(.94 + var(--j)*.0085))}}
.dli:hover{translate:0 -4px}
.dli .dlt{grid-column:1;font-size:14px;font-weight:600;color:var(--ink-strong)}
.dli .dls{grid-column:1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dli .chev{grid-column:2;grid-row:1/3;opacity:.7}
.dli:hover .dlt{color:var(--accent)}
.dli.cur .dlt{color:var(--accent)}

/* tablas de las tarjetas */
.dt-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.dt-tbl th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted);text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt-tbl th:first-child,.dt-tbl td:first-child{text-align:left;font-family:var(--font)}
.dt-tbl td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dt-tbl tbody tr:hover td{background:var(--glass-flat)}
.dt-tbl tr.ref td{color:var(--muted)}
.dt-tbl tr.tot td{font-weight:600;color:var(--ink-strong);background:var(--glass-flat)}
.dt-tbl tr.sel td{background:var(--accent-soft)}
.dt-tbl td.neg{color:var(--neg)}
.dt-tbl td.w{white-space:normal;font-family:var(--font);text-align:left}
.cap{margin:10px 0 0;font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--muted)}
.prio{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:600;font-family:var(--font)}
.prio.a{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.prio.m{background:color-mix(in srgb,var(--warn) 18%,transparent);color:color-mix(in srgb,var(--warn) 50%,var(--ink-strong))}
.prio.b{background:var(--glass-flat);color:var(--muted)}
.chk{appearance:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--muted);display:grid;place-items:center;cursor:pointer;background:transparent;padding:0;transition:background .2s,border-color .2s}
.chk svg{width:12px;height:12px;fill:none;stroke:var(--bg);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s var(--spring)}
.chk[aria-checked="true"]{background:var(--ink-strong);border-color:var(--ink-strong)}
.chk[aria-checked="true"] svg{opacity:1;transform:none}
tr.done td.w{color:var(--muted);text-decoration:line-through}
.dfit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}

/* ---------- pantallas pequeñas ---------- */
@media (max-width:1180px){.bento{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){
  body{overflow:auto}.app{height:auto;min-height:100dvh}
  .stage{grid-template-columns:minmax(0,1fr)}.map{height:min(720px,90dvh)}.panel{overflow:visible}
}
@media (max-width:640px){

  .mtop{grid-template-columns:minmax(0,1fr) auto}.mtop .gb{grid-column:1/-1;grid-row:2;justify-content:flex-start}.mtop>.dot{grid-column:2;grid-row:1}
  .tl.x4{grid-template-columns:1fr 1fr}.dfit{grid-template-columns:minmax(0,1fr)}.panel{padding:22px 18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- utilidades visuales ---------- */
function spark(vals, sel) {
  const W = 200, H = 40, p = 3, ok = vals.filter(v => v != null); if (ok.length < 2) return '';
  const xs = vals.map((_, i) => p + i * (W - 2 * p) / (vals.length - 1)), lo = Math.min(...ok), hi = Math.max(...ok), sp = hi - lo || 1;
  const ys = vals.map(v => v == null ? null : H - p - (v - lo) / sp * (H - 2 * p));
  const pts = xs.map((x, i) => ys[i] == null ? null : [x, ys[i]]).filter(Boolean);
  const d = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('');
  const id = 'g' + Math.random().toString(36).slice(2, 8), si = sel == null ? vals.length - 1 : sel;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--chart)" stop-opacity=".22"/><stop offset="1" stop-color="var(--chart)" stop-opacity="0"/></linearGradient></defs>
    <path d="${d}L${pts[pts.length - 1][0]} ${H}L${pts[0][0]} ${H}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="var(--chart)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${ys[si] == null ? '' : `<circle cx="${xs[si]}" cy="${ys[si]}" r="3" fill="var(--surface)" stroke="var(--chart)" stroke-width="1.8" vector-effect="non-scaling-stroke"/>`}</svg>`;
}
function slide(nav, instant) {
  let hl = nav.querySelector(':scope>.hl');
  if (!hl) { hl = document.createElement('i'); hl.className = 'hl'; nav.prepend(hl); }
  const b = nav.querySelector('button[aria-pressed="true"]');
  if (!b || !b.offsetWidth) { hl.classList.remove('on'); return; }
  hl.classList.toggle('anim', !instant && hl.classList.contains('on'));
  hl.style.transform = `translate(${b.offsetLeft}px,${b.offsetTop}px)`;
  hl.style.width = b.offsetWidth + 'px'; hl.style.height = b.offsetHeight + 'px';
  hl.classList.add('on');
  const l = b.offsetLeft - nav.scrollLeft;
  if (l < 0 || l + b.offsetWidth > nav.clientWidth) nav.scrollTo({left: b.offsetLeft - 24, behavior: 'smooth'});
}
function menu(nav, items, cur, onPick, lead = '') {
  nav.innerHTML = lead + items.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${v === cur}">${l}</button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.onclick = () => {
    nav.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    slide(nav); onPick(b.dataset.v);

    const Vv = M.ventas[i], CV = M.costo_ventas[i], GO = M.gastos[i], mo = (Vv - CV - GO) / Vv * 100, ref = i < idx0;
    return `<tr class="${ref ? 'ref' : ''} ${S.mes === k ? 'sel' : ''}"><td>${lbl(k)} ${k.slice(0, 4)}${ref ? '*' : ''}</td><td>${nf(Vv)}</td><td>${nf(CV)}</td><td>${pct((Vv - CV) / Vv * 100)}</td><td>${nf(GO)}</td><td class="${mo < 0 ? 'neg' : ''}">${pct(mo)}</td><td>${nf(M.compras[i])}</td><td>${M.transferencias[i] == null ? '—' : nf(M.transferencias[i])}</td></tr>`;
  }).join('');
  const ii = PER.map(ix), r = calc(ii);
  db.innerHTML = `<div style="overflow-x:auto"><table class="dt-tbl"><thead><tr><th>Cifras mensuales</th><th>Ventas</th><th>Costo de ventas</th><th>Margen bruto</th><th>Gastos op.</th><th>Margen op.</th><th>Compras</th><th>Transf. netas</th></tr></thead>
    <tbody>${rows}<tr class="tot"><td>${perCorto()} 2026</td><td>${nf(r.V)}</td><td>${nf(r.CV)}</td><td>${pct(r.mb)}</td><td>${nf(r.GO)}</td><td class="neg">${pct(r.mo)}</td><td>${nf(sum(M.compras, ii))}</td><td>${nf(sum(M.transferencias, ii))}</td></tr></tbody></table></div>
    <p class="cap">USD. Ventas y costo de ventas de los apuntes contables (cuentas 4.1.1 y 5.3.1); gastos operativos, cuenta 6; compras y transferencias de los archivos operativos. * Costo de transferencias referencial.</p>`;
}
function cardGastos(db) {
  db.innerHTML = `<div class="dfit"><table class="dt-tbl"><thead><tr><th>Estructura de gastos</th><th>% del gasto</th></tr></thead><tbody>
    ${D.estructura_gastos.map(g => `<tr><td>${g.rubro}</td><td>${pct(g.pct)}</td></tr>`).join('')}</tbody></table>
    <div class="cgs"><div class="cg"><h4>Participación · dic – oct</h4>${D.estructura_gastos.map((g, k) => `<div class="pr"><div class="l"><span>${g.rubro}</span><b>${pct(g.pct)}</b></div><div class="trk"><i style="--c:var(--chart);--w:${g.pct / 40};--k:${k}"></i></div></div>`).join('')}</div></div></div>
    <p class="cap">Gasto operativo de diciembre a octubre (cuenta 6). El gasto de personal registrado, unos USD 1.300 al mes, es bajo para un supermercado: conviene confirmar si parte de la nómina se paga desde EDEC EP.</p>`;
}
function cardOrigen(db) {
  db.innerHTML = `<div class="dfit"><table class="dt-tbl"><thead><tr><th>Origen de lo vendido</th><th>USD</th><th>%</th></tr></thead><tbody>
    ${D.origen.map(o => `<tr><td class="w">${o.origen}</td><td>${nf(o.usd)}</td><td>${pct(o.pct)}</td></tr>`).join('')}<tr class="tot"><td>Total</td><td>${nf(D.origen.reduce((s, o) => s + o.usd, 0))}</td><td>100,0 %</td></tr></tbody></table>
    <div class="cgs"><div class="cg"><h4>Principales fuentes · mar – sep</h4>${D.proveedores.map((p, k) => `<div class="pr"><div class="l"><span>${p.nombre}</span><b>${pct(p.pct)}</b></div><div class="trk"><i style="--c:${k ? 'var(--chart-2)' : 'var(--chart)'};--w:${p.pct / 40};--k:${k}"></i></div></div>`).join('')}</div></div></div>
    <p class="cap">Los USD 12.207 sin entrada son productos que entran a granel con un código y se venden fraccionados con otro (lenteja, chía, almendras, huevo en cubeta, zumo de naranja).</p>`;
}
function cardPareto(db) {
  const P = D.pareto;
  db.innerHTML = `<div class="dfit"><table class="dt-tbl"><thead><tr><th>% de productos</th><th>% de ventas</th></tr></thead><tbody>
    ${P.x.slice(1).map((x, k) => `<tr class="${x === 20 ? 'sel' : ''}"><td>${x} %</td><td>${pct(P.y[k + 1])}</td></tr>`).join('')}</tbody></table>
    <div class="cgs"><div class="cg"><h4>Curva de Pareto · dic – sep</h4><div class="chart" style="height:170px"><canvas id="d1"></canvas></div></div>
    <div class="cg"><h4>Clases</h4><div class="tl x4" style="grid-template-columns:repeat(3,1fr)">${[['A', 'hasta 80 %'], ['B', '80 – 95 %'], ['C', 'último 5 %']].map(([c, s]) => `<div><span>Clase ${c}</span><b>${nf(P.abc[c])}</b><em>${s}</em></div>`).join('')}</div></div></div></div>`;
  pareto('d1');
}
function cardCobertura(db) {
  const cb = D.cobertura, tot = cb.completos + cb.parciales + cb.sin_datos;
  db.innerHTML = `<table class="dt-tbl"><thead><tr><th>Cobertura por familia</th><th>Completos</th><th>Parciales</th><th>Sin datos</th></tr></thead><tbody>
    ${['C', 'F', 'O', 'A'].map(f => { const it = IND.filter(i => i.f === f), c = e => it.filter(i => i.e === e).length; return `<tr><td>${FAM_L[f]}</td><td>${c('full')}</td><td>${c('part')}</td><td>${c('none')}</td></tr>`; }).join('')}
    <tr class="tot"><td>Total</td><td>${cb.completos}</td><td>${cb.parciales}</td><td>${cb.sin_datos}</td></tr></tbody></table>
    <p class="cap">Con base para calcular: ${cb.completos + cb.parciales} de ${tot} indicadores (${nf((cb.completos + cb.parciales) / tot * 100, 0)} %) y el ${cb.tablero_pct} % del tablero principal. Cobertura de caja y velocidad de pago dependen de tesorería, que no se separa por tienda.</p>`;
}
function cardFaltan(db) {
  const PR = {a: 'Alta', m: 'Media', b: 'Baja'}, CK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  db.innerHTML = `<table class="dt-tbl"><thead><tr><th></th><th style="text-align:left">Dato que falta</th><th>Indicadores</th><th>Prioridad</th></tr></thead><tbody>
    ${D.faltan.map((f, i) => `<tr class="${HECHOS.has(i) ? 'done' : ''}"><td style="width:28px"><button class="chk" data-i="${i}" role="checkbox" aria-checked="${HECHOS.has(i)}" aria-label="Recibido">${CK}</button></td><td class="w">${f[0]}<div style="font-size:11px;color:var(--muted);text-decoration:none">${f[3]}</div></td><td>${f[1]}</td><td><span class="prio ${f[2]}">${PR[f[2]]}</span></td></tr>`).join('')}</tbody></table>
    <p class="cap">Marca cada dato cuando CUMA lo entregue; la marca se guarda solo en este navegador.</p>`;
  db.querySelectorAll('.chk').forEach(b => b.onclick = () => {
    const i = +b.dataset.i; HECHOS.has(i) ? HECHOS.delete(i) : HECHOS.add(i);
    try { localStorage.setItem('cuma-datos-recibidos', JSON.stringify([...HECHOS])); } catch (e) {}
    b.setAttribute('aria-checked', HECHOS.has(i)); b.closest('tr').classList.toggle('done', HECHOS.has(i));
    const s = $('pin').querySelector(`.dli[data-i="5"] .dls`); if (s) s.textContent = TARJETAS[5].s();
  });
}
function cardUmbrales(db) {
  db.innerHTML = `<table class="dt-tbl"><thead><tr><th>Indicador</th><th style="text-align:left">Umbral</th><th>Valor</th><th>Semáforo</th></tr></thead><tbody>
    ${TABLERO.map(id => `<tr><td>${id} · ${BY[id].c}</td><td class="w">${U[id] ? U[id].txt : 'Por calibrar'}</td><td>${V[id].v}</td><td><span style="display:inline-flex"><span class="dot sm ${V[id].st}"></span></span></td></tr>`).join('')}</tbody></table>
    <p class="cap">Umbrales provisionales: margen de las otras tiendas cerca de 23 %, autosuficiencia plena en 100 % y concentración moderada entre 1.500 y 2.500 puntos.</p>`;
}

/* ---------- periodo ---------- */
function refresh() {
  compute(); renderBento(false);
  if (S.datos) { if (S.card != null) { kill('d1'); TARJETAS[S.card].b($('deck').querySelector('.db')); } renderDatosPanel(); }
  else swap($('pin'), renderPanel);
}
function buildMes() {
  const items = [['acum', `${perCorto()}<small>2026</small>`], ...PER.map(k => [k, lbl(k)])];
  menu($('mes'), items, S.mes, v => { S.mes = v; refresh(); }, '<span>Periodo</span>');
}
function setInicio(k) {
  PER = D.meses.slice(ix(k));
  if (S.mes !== 'acum' && !PER.includes(S.mes)) S.mes = 'acum';
  buildMes(); refresh();
}

/* ---------- arranque y eventos ---------- */
buildMes();
menu($('fam'), Object.entries(FAM), S.fam, v => {
  if (S.datos) closeDatos(false);
  S.fam = v; S.sel = null; S.todos = false;
  renderBento(); renderSub(); swap($('pin'), renderPanel);
});
$('dtoggle').onclick = () => S.datos ? closeDatos() : openDatos();
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.datos) { if (S.card != null) pickCard(null); else closeDatos(); }
  else if (S.sel) pick(null);
});
addEventListener('resize', () => document.querySelectorAll('.rsel,.gb,.il').forEach(n => slide(n, true)));

const THEMES = ['auto', 'light', 'dark'], TL = {auto: 'automático', light: 'claro', dark: 'oscuro'};
let theme = 'auto';
try { theme = localStorage.getItem('cuma-theme') || 'auto'; } catch (e) {}
const applyTheme = () => { if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme; $('theme').title = 'Tema: ' + TL[theme]; };
const repaint = () => { applyTheme(); defaults(); compute(); renderBento(false); renderPanel(); if (S.datos && S.card != null) { kill('d1'); TARJETAS[S.card].b($('deck').querySelector('.db')); } };
$('theme').onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; try { localStorage.setItem('cuma-theme', theme); } catch (e) {} repaint(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (theme === 'auto') repaint(); });

applyTheme(); defaults(); compute(); renderBento(false); renderSub(); renderPanel();
})();
</script>
</body>
</html>
