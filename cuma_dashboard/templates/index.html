<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CUMA · Indicadores</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Misma gramática que Corbatul Twin: una sola página, panel izquierdo con menú por etapas y carpetas de vidrio
   apiladas, ficha a la derecha. Papel frío, gris tinta, verde como único acento, semáforo iOS. */
:root{
  --bg:#fdfdfd; --surface:#f8f8f8; --surface2:#efefef; --ink:#2c2c2e; --ink-strong:#111111;
  --muted:#6b6b70; --line:#e1e1e3; --line-soft:#ededef; --accent:#2f6b45; --accent-soft:#e8f0eb; --neg:#b0322f;
  --ok:#34c759; --warn:#f5b400; --bad:#ff3b30; --na:#a3a3a8;
  --ok-halo:rgba(52,199,89,.22); --warn-halo:rgba(245,180,0,.28); --bad-halo:rgba(255,59,48,.2); --na-halo:rgba(142,142,147,.2);
  --dedge:rgba(0,0,0,.13); --dglass:rgba(255,255,255,.4); --dscrim:rgba(243,243,243,.3);
  --glass-flat:rgba(0,0,0,.055); --glass-hi:rgba(255,255,255,.95); --glass-shadow:rgba(0,0,0,.22);
  --shadow-lg:0 32px 80px -24px rgba(0,0,0,.38);
  --c1:#2f6b45; --c2:#95c623; --c3:#e55812; --c4:#5f5f63; --c5:#8fd9ac; --c6:#dcd3c4;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.32,.72,0,1);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0c0d; --surface:#141415; --surface2:#1c1c1e; --ink:#cfcfd3; --ink-strong:#f5f5f7;
  --muted:#8d8d92; --line:#2a2a2d; --line-soft:#1f1f21; --accent:#86c9a0; --accent-soft:#15241b; --neg:#f2928a;
  --ok:#30d158; --warn:#ffd60a; --bad:#ff453a; --na:#6b6b70;
  --ok-halo:rgba(48,209,88,.24); --warn-halo:rgba(255,214,10,.22); --bad-halo:rgba(255,69,58,.24); --na-halo:rgba(142,142,147,.22);
  --dedge:rgba(255,255,255,.17); --dglass:rgba(72,72,76,.3); --dscrim:rgba(12,12,13,.34);
  --glass-flat:rgba(255,255,255,.09); --glass-hi:rgba(255,255,255,.3); --glass-shadow:rgba(0,0,0,.6);
  --shadow-lg:0 32px 80px -24px rgba(0,0,0,.85);
  --c1:#86c9a0; --c2:#a8d63a; --c3:#f06a26; --c4:#9a9a9f; --c5:#3f9265; --c6:#8f887c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0c0d; --surface:#141415; --surface2:#1c1c1e; --ink:#cfcfd3; --ink-strong:#f5f5f7;
  --muted:#8d8d92; --line:#2a2a2d; --line-soft:#1f1f21; --accent:#86c9a0; --accent-soft:#15241b; --neg:#f2928a;
  --ok:#30d158; --warn:#ffd60a; --bad:#ff453a; --na:#6b6b70;
  --ok-halo:rgba(48,209,88,.24); --warn-halo:rgba(255,214,10,.22); --bad-halo:rgba(255,69,58,.24); --na-halo:rgba(142,142,147,.22);
  --dedge:rgba(255,255,255,.17); --dglass:rgba(72,72,76,.3); --dscrim:rgba(12,12,13,.34);
  --glass-flat:rgba(255,255,255,.09); --glass-hi:rgba(255,255,255,.3); --glass-shadow:rgba(0,0,0,.6);
  --shadow-lg:0 32px 80px -24px rgba(0,0,0,.85);
  --c1:#86c9a0; --c2:#a8d63a; --c3:#f06a26; --c4:#9a9a9f; --c5:#3f9265; --c6:#8f887c;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;
  background:radial-gradient(38vmax 30vmax at 8% 4%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 70%),
             radial-gradient(34vmax 28vmax at 96% 88%,color-mix(in srgb,var(--c2) 10%,transparent),transparent 70%)}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{height:100dvh;max-width:1560px;margin-inline:auto;display:grid;grid-template-rows:auto minmax(0,1fr);gap:18px;
  padding:clamp(16px,2.4vw,30px) clamp(16px,3vw,44px) clamp(16px,2.4vw,28px)}

/* ---------- cabecera ---------- */
.mark{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));box-shadow:0 8px 20px -10px var(--accent)}
.mark svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.t-cuma{font-family:var(--display);font-size:clamp(1.9rem,3.2vw,2.5rem);font-weight:700;letter-spacing:.02em;line-height:1;color:var(--ink-strong)}
.t-stack{position:relative;padding-left:12px;display:flex;flex-direction:column;gap:1px;font-size:12px}
.t-stack::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:1.5px;background:color-mix(in srgb,var(--muted) 55%,transparent)}
.t-main{font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-strong)}
.t-sub{font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fig{display:flex;flex-direction:column;gap:1px;padding:0 22px;border-left:1px solid var(--line);min-width:0}
.fig:first-child{border-left:0;padding-left:0}
.fig>span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fig b{font-family:var(--display);font-weight:600;font-size:1.35rem;line-height:1.2;color:var(--ink-strong);white-space:nowrap}
.fig small{font-size:11px;color:var(--muted);white-space:nowrap}
.eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* ---------- menús con resaltado que se desliza (como «Ronda» y las etapas del simulador) ---------- */
.rsel{position:relative;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--glass-flat);width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none;isolation:isolate}
.rsel::-webkit-scrollbar{display:none}
.rsel>span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 8px 0 10px;white-space:nowrap}
.rsel button,.gb button,.il button{position:relative;z-index:1;appearance:none;border:0;background:transparent;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--muted);transition:color .45s var(--spring)}
.rsel button{padding:6px 13px;border-radius:999px;font-size:13px}
.rsel button small{font-size:10.5px;font-weight:500;color:var(--muted);margin-left:4px}
.rsel button:hover,.gb button:hover,.il button:hover{color:var(--ink-strong)}
.rsel button[aria-pressed="true"],.gb button[aria-pressed="true"],.il button[aria-pressed="true"]{color:var(--ink-strong)}
.hl{position:absolute;left:0;top:0;z-index:0;pointer-events:none;opacity:0;border-radius:999px;will-change:transform,width}
.hl.on{opacity:1}
.hl.anim{transition:transform .55s var(--spring),width .55s var(--spring),height .55s var(--spring),opacity .3s}
.rsel .hl{background:var(--surface);box-shadow:0 1px 3px var(--glass-shadow)}
.gb,.il{position:relative;display:flex;align-items:center;justify-content:center;gap:2px;padding:4px;isolation:isolate;max-width:100%;overflow-x:auto;scrollbar-width:none}
.gb::-webkit-scrollbar,.il::-webkit-scrollbar{display:none}
.gb .hl,.il .hl{border-radius:10px;background:var(--glass-flat);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
.gb button,.il button{padding:8px 15px;border-radius:10px;font-size:12.5px}
.gb button+button::before,.il button+button::before{content:"";position:absolute;left:-2px;top:28%;bottom:28%;width:1px;background:var(--line);transition:opacity .25s}
.gb button[aria-pressed="true"]::before,.gb button[aria-pressed="true"]+button::before,.il button[aria-pressed="true"]::before,.il button[aria-pressed="true"]+button::before{opacity:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn{width:34px;height:34px;flex:none;border-radius:50%;border:0;display:grid;place-items:center;background:var(--glass-flat);color:var(--ink-strong);cursor:pointer;transition:background .2s}
.icon-btn:hover{background:var(--line)}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- escenario: mapa + ficha ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(0,1fr);gap:22px;min-height:0}
.glass{-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  background:color-mix(in srgb,var(--surface) 30%,transparent);border:1px solid var(--line);border-radius:28px;box-shadow:inset 0 1px 0 var(--glass-hi)}
.map{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.mtop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px 14px;padding:12px 14px}
.mtop .gb{grid-column:2;transition:opacity .35s ease,filter .5s var(--ease)}
.map.dk .mtop .gb{opacity:.35;filter:blur(3px);pointer-events:none}
.dtoggle{grid-column:1;justify-self:start;appearance:none;display:inline-flex;align-items:center;gap:7px;margin:0;padding:7px 14px 7px 11px;border:0;border-radius:999px;background:var(--glass-flat);color:var(--ink-strong);font-size:12.5px;font-weight:600;cursor:pointer;transition:background .3s,box-shadow .3s}
.dtoggle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dtoggle:hover{background:var(--line)}
.dtoggle[aria-expanded="true"]{background:var(--surface);box-shadow:0 1px 3px var(--glass-shadow)}

/* semáforo con respiración */
.dot{--c:var(--na);--h:var(--na-halo);position:relative;flex:none;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--h);transition:background-color .3s,box-shadow .3s}
.dot::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);opacity:0;animation:breath 3.4s cubic-bezier(.45,0,.25,1) infinite}
.dot.ok{--c:var(--ok);--h:var(--ok-halo)}.dot.warn{--c:var(--warn);--h:var(--warn-halo)}.dot.bad{--c:var(--bad);--h:var(--bad-halo)}
.dot.na::before{display:none}
@keyframes breath{0%,100%{transform:scale(1);opacity:0}18%{opacity:.38}55%{transform:scale(2.5);opacity:0}}
.mtop .dot{grid-column:3;justify-self:end;margin-right:8px}

.mbody{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.view{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin;padding:4px 18px 12px;transition:opacity .2s ease,transform .25s var(--ease),filter .6s var(--ease)}
.view.tab{display:flex;flex-direction:column}
.grp.grow{flex:1 1 auto;min-height:150px;margin-bottom:0}
.grp.grow .chart{flex:1 1 auto;min-height:0}
.view.out{opacity:0;transform:translateY(8px) scale(.992)}
.mbody.dk .view{filter:blur(9px)}
.il{border-top:1px solid var(--line);margin:0 14px;padding:8px 4px 10px;justify-content:flex-start;transition:opacity .18s ease,transform .18s ease,filter .6s var(--ease)}
.il.out{opacity:0;transform:translateY(5px)}
.map.dk .il{filter:blur(9px);opacity:.5;pointer-events:none}

/* grupos y tarjetas de indicador */
.grp{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.grp>h4{margin:6px 2px 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:10px}
.grp>h4::after{content:"";flex:1;height:1px;background:var(--line)}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(5,minmax(0,1fr))}
.tiles.wide{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tile{appearance:none;position:relative;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left;cursor:pointer;
  padding:12px 12px 10px;border-radius:20px;border:1px solid transparent;background:var(--glass-flat);
  transition:transform .35s var(--spring),background .3s,border-color .3s,box-shadow .35s;animation:tileIn .55s var(--ease) both;animation-delay:calc(var(--j)*35ms)}
@keyframes tileIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.tile:hover{transform:translateY(-3px);background:color-mix(in srgb,var(--surface) 80%,transparent)}
.tile[aria-pressed="true"]{background:var(--surface);border-color:var(--dedge);box-shadow:0 14px 30px -18px var(--glass-shadow)}
.tile .t-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tile .t-id{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .t-n{font-size:11.5px;font-weight:600;color:var(--ink);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-1px}
.tile .t-v{font-family:var(--display);font-size:clamp(1rem,1.45vw,1.35rem);font-weight:600;letter-spacing:-.025em;color:var(--ink-strong);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .t-v.txt{font-size:1.05rem;color:var(--muted);font-weight:500}
.tile .t-v small{font-size:.58em;font-weight:500;letter-spacing:0;color:var(--muted);margin-left:3px}
.tile .t-s{font-size:11px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile svg.spark{display:block;width:100%;height:26px;overflow:visible;margin-top:2px}
.tile .bar{height:5px;border-radius:99px;background:var(--glass-flat);overflow:hidden;margin:11px 0 10px}
.tile .bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transform-origin:left;animation:grow .9s var(--ease) both .2s}
.tile .bar.void{background:repeating-linear-gradient(90deg,var(--glass-flat) 0 5px,transparent 5px 9px)}
@keyframes grow{from{transform:scaleX(0)}}
.tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:10px;font-weight:600;white-space:nowrap}
.tag.full{background:var(--accent-soft);color:var(--accent)}
.tag.part{background:color-mix(in srgb,var(--warn) 18%,transparent);color:color-mix(in srgb,var(--warn) 50%,var(--ink-strong))}
.tag.none{background:var(--glass-flat);color:var(--muted)}

/* ---------- carpetas de vidrio apiladas sobre el mapa ---------- */
.deck{--peek:58px;position:absolute;inset:0;z-index:5;overflow:hidden;visibility:hidden;pointer-events:none;transition:visibility 0s .8s}
.deck.open{visibility:visible;pointer-events:auto;transition-delay:0s}
.dscrim{position:absolute;inset:0;background:var(--dscrim);opacity:0;transition:opacity .45s ease}
.deck.open .dscrim{opacity:1}
.dc{position:absolute;left:14px;right:14px;top:calc(100% + 24px);height:calc(100% - 24px);z-index:calc(var(--i) + 1);overflow:hidden;
  border:1px solid var(--dedge);border-radius:22px;background:var(--dglass);
  -webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);
  box-shadow:inset 0 1px 0 var(--glass-hi),0 -10px 24px -18px var(--glass-shadow);
  opacity:0;transform-origin:50% 0;transform:scale(.94);
  transition:top .6s var(--ease),transform .6s var(--ease),opacity .35s ease,translate .25s ease;
  transition-delay:calc((var(--n) - var(--i))*22ms)}
.deck.open .dc{opacity:1;top:calc(100% - 96px + (var(--i) - var(--n) + 1)*var(--peek));transform:scale(calc(.955 + var(--i)*.0075));transition-delay:calc(var(--i)*40ms)}
.deck.open:not(.sel) .dc:hover{translate:0 -6px;transition-delay:0s}
.deck.open.sel .dc{top:calc(100% + 24px);opacity:0;pointer-events:none;transition-delay:0s}
.deck.open.sel .dc.on{top:12px;opacity:1;pointer-events:auto;transform:scale(1);z-index:50;box-shadow:inset 0 1px 0 var(--glass-hi),0 16px 30px -18px var(--glass-shadow)}
.dh{appearance:none;position:relative;z-index:2;display:flex;align-items:center;gap:12px;width:100%;height:58px;margin:0;padding:0 20px;border:0;background:transparent;text-align:left;cursor:pointer}
.fold{width:22px;height:22px;flex:none;color:var(--accent)}
.fold svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.dtx{flex:1;min-width:0;display:flex;flex-direction:column}
.dt{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{flex:none;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s var(--ease)}
.dc.on .dh .chev{transform:rotate(90deg)}
.dc.on .dh::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:1px;background:var(--line)}
.db{position:absolute;left:0;right:0;top:58px;bottom:0;overflow:auto;padding:12px 20px 22px;scrollbar-width:thin;opacity:0;visibility:hidden;transition:opacity .2s ease,visibility 0s .2s}
.dc.on .db{opacity:1;visibility:visible;transition:opacity .4s ease .25s,visibility 0s}

/* ---------- ficha (panel derecho) ---------- */
.panel{min-width:0;min-height:0;overflow-y:auto;scrollbar-width:thin;padding:22px 26px 24px}
.pin{display:flex;flex-direction:column;gap:16px;transition:opacity .18s ease,transform .25s var(--ease)}
.pin.out{opacity:0;transform:translateY(8px)}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:32px}
.pill-btn{appearance:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 13px 6px 10px;background:var(--glass-flat);font-size:12.5px;font-weight:600;color:var(--ink-strong);cursor:pointer;transition:background .2s}
.pill-btn:hover{background:var(--line)}
.pill-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.phead{display:flex;flex-direction:column;gap:4px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:8px}
.panel h2{margin:0;font-family:var(--display);font-weight:600;font-size:1.4rem;line-height:1.2;letter-spacing:-.015em;color:var(--ink-strong);text-wrap:balance}
.panel p{margin:0}
.lede{color:var(--muted);font-size:13px}
.bigrow{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px}
.big{font-family:var(--display);font-size:clamp(2rem,3.4vw,2.8rem);font-weight:600;letter-spacing:-.035em;line-height:1;color:var(--ink-strong)}
.big small{font-size:.4em;font-weight:500;letter-spacing:0;color:var(--muted);margin-left:6px}
.state{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink)}
.note{padding:10px 13px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:12.5px;line-height:1.45}
.sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.sec>h3{margin:0;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.lg i.dash{width:13px;height:0;border-radius:0;border-top:2px dashed currentColor;vertical-align:3px}
.chart{position:relative;width:100%}
.formula{padding:16px;border-radius:16px;background:var(--glass-flat);text-align:center;font-family:'Times New Roman',Georgia,serif;font-size:18px;color:var(--ink-strong);overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px}
.fr>span{padding:0 4px}.fr>span:first-child{border-bottom:1px solid currentColor;padding-bottom:2px}.fr>span:last-child{padding-top:2px}
.formula sub,.formula sup{font-size:.62em}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.meta div{background:var(--glass-flat);border-radius:14px;padding:8px 11px;min-width:0}
.meta span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.meta b{font-size:12.5px;font-weight:600;color:var(--ink-strong)}
.src{display:flex;flex-wrap:wrap;gap:6px}
.src span{padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:500;background:var(--glass-flat);color:var(--muted)}
.src span.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.counts div{background:var(--glass-flat);border-radius:14px;padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.counts b{font-family:var(--display);font-size:1.3rem;font-weight:600;color:var(--ink-strong);display:flex;align-items:center;gap:8px}
.counts span{font-size:11px;color:var(--muted);line-height:1.25}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;border-radius:18px;border:1px dashed var(--line);text-align:center;color:var(--muted);font-size:12.5px}
.empty svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.7}

/* lista apilada de carpetas en la ficha */
.dstack{position:relative;height:calc(var(--n)*52px + 34px);margin-top:2px}
.dli{appearance:none;position:absolute;left:0;right:0;top:calc(var(--j)*52px);height:80px;z-index:calc(var(--j) + 1);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1px 12px;align-content:start;align-items:center;width:100%;text-align:left;padding:12px 16px 0;border:1px solid var(--dedge);border-radius:20px;background:var(--dglass);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);box-shadow:inset 0 1px 0 var(--glass-hi),0 -10px 24px -18px var(--glass-shadow);color:var(--ink);cursor:pointer;transform-origin:50% 0;transform:scale(calc(.94 + var(--j)*.0085));transition:translate .25s ease;animation:dliIn .55s var(--ease) both;animation-delay:calc(var(--j)*45ms)}
@keyframes dliIn{from{opacity:0;transform:translateY(34px) scale(.92)}to{opacity:1;transform:scale(calc(.94 + var(--j)*.0085))}}
.dli:hover{translate:0 -4px}
.dli .fold{grid-row:1/3;width:20px;height:20px}
.dli .dlt{font-size:13.5px;font-weight:600;color:var(--ink-strong)}
.dli .dls{grid-column:2;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dli .chev{grid-column:3;grid-row:1/3}
.dli:hover .dlt{color:var(--accent)}

/* tablas */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted);text-align:right;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr:hover td{background:var(--glass-flat)}
.tbl tr.ref td{color:var(--muted)}
.tbl tr.tot td{font-weight:600;color:var(--ink-strong);background:var(--glass-flat);border-bottom:0}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl td.neg{color:var(--neg)}
.tbl td.wrap{white-space:normal}
.cap{margin:10px 0 0;font-size:11.5px;color:var(--muted);line-height:1.45}
.prio{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:600}
.prio.a{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.prio.m{background:color-mix(in srgb,var(--warn) 18%,transparent);color:color-mix(in srgb,var(--warn) 50%,var(--ink-strong))}
.prio.b{background:var(--glass-flat);color:var(--muted)}
.trk{height:7px;border-radius:99px;background:var(--glass-flat);overflow:hidden}
.trk i{display:block;height:100%;border-radius:99px;background:var(--c);width:calc(var(--w)*100%);transform-origin:left;animation:grow .9s var(--ease) both .3s}
.dfit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}

/* ---------- pantallas pequeñas: se apila y la página se desplaza ---------- */
@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){
  body{overflow:auto}.app{height:auto;min-height:100dvh}
  .stage{grid-template-columns:minmax(0,1fr)}
  .map{height:min(760px,92dvh)}.panel{overflow:visible}
}
@media (max-width:640px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.meta,.counts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mtop{grid-template-columns:minmax(0,1fr) auto}.mtop .gb{grid-column:1/-1;grid-row:2;justify-content:flex-start}.mtop .dot{grid-column:2;grid-row:1}
  .fig{padding:0 14px}.dfit{grid-template-columns:minmax(0,1fr)}.panel{padding:20px 18px}
}

/* ======================================================================
   Vista oscura «Casillero»: rejilla bento que se reacomoda (FLIP) al elegir una celda.
   Siempre oscura, acento verde neón. Solo visible con el tema oscuro.
   ====================================================================== */
body[data-vista="casillero"] .app{display:none}
body:not([data-vista="casillero"]) #casillero{display:none}
#casillero{--cs-bg:#08080a;--cs-cell:#121215;--cs-cell2:#18181c;--cs-edge:rgba(255,255,255,.07);--cs-edge2:rgba(255,255,255,.14);
  --cs-ink:#f5f5f6;--cs-mut:#8b8b93;--cs-dim:#26262c;--cs-neon:#3dff8f;--cs-neon-2:#0fd46a;--cs-neon-soft:rgba(61,255,143,.12);
  --cs-amber:#ffc83d;--cs-red:#ff5a4f;--cs-grey:#5c5c64;
  position:fixed;inset:0;overflow:auto;background:var(--cs-bg);color:var(--cs-ink);color-scheme:dark;font-family:var(--font);-webkit-font-smoothing:antialiased}
#casillero::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60vmax 40vmax at 85% -10%,rgba(61,255,143,.07),transparent 60%)}
.cs-wrap{position:relative;max-width:1560px;margin-inline:auto;min-height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);gap:20px;padding:clamp(18px,2.6vw,32px) clamp(16px,3vw,44px)}
@media (min-width:981px){.cs-wrap{height:100dvh}}
.cs-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px}
.cs-eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--cs-mut)}
.cs-eyebrow b{color:var(--cs-neon);font-weight:700}
.cs-title{margin:6px 0 0;font-family:var(--display);font-size:clamp(1.8rem,3.1vw,2.9rem);font-weight:600;letter-spacing:-.04em;line-height:1.02;color:var(--cs-ink)}
.cs-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:0;max-width:100%}
.cs-ctl{min-width:0;max-width:100%}
.cs-top>div{min-width:0;max-width:100%}
.cs-hint{font-size:13.5px;color:var(--cs-mut)}
.cs-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#casillero .rsel{background:rgba(255,255,255,.06)}
#casillero .rsel>span{display:none}
#casillero .rsel button{padding:6px 11px}
#casillero .rsel>span,#casillero .rsel button,#casillero .rsel button small{color:var(--cs-mut)}
#casillero .rsel button:hover,#casillero .rsel button[aria-pressed="true"]{color:#0a0a0b}
#casillero .rsel button:hover:not([aria-pressed="true"]){color:var(--cs-ink)}
#casillero .rsel button[aria-pressed="true"] small{color:#0a0a0b;opacity:.6}
#casillero .rsel .hl{background:var(--cs-neon);box-shadow:0 0 18px -2px rgba(61,255,143,.55)}
#casillero .icon-btn{background:rgba(255,255,255,.07);color:var(--cs-ink)}
#casillero .icon-btn:hover{background:rgba(255,255,255,.13)}

.cs-rejilla{display:grid;gap:12px;min-height:0;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));
  grid-template-areas:"a a b c" "d e e f" "g g h f"}
.cs-rejilla[data-forma="a"]{grid-template-areas:"a a b c" "a a d e" "f g g h"}
.cs-rejilla[data-forma="b"]{grid-template-areas:"b b a c" "b b d e" "f g g h"}
.cs-rejilla[data-forma="c"]{grid-template-areas:"a c c b" "d c c e" "f g g h"}
.cs-rejilla[data-forma="d"]{grid-template-areas:"a b d d" "c e d d" "f g g h"}
.cs-rejilla[data-forma="e"]{grid-template-areas:"a b c d" "e e f h" "e e g g"}
.cs-rejilla[data-forma="f"]{grid-template-areas:"a b c d" "f f e h" "f f g g"}
.cs-rejilla[data-forma="g"]{grid-template-areas:"a b c d" "g g g g" "e f h h";grid-template-rows:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr)}
.cs-rejilla[data-forma="h"]{grid-template-areas:"a b c d" "h h e f" "h h g g"}
.cs-celda[data-celda="a"]{grid-area:a}.cs-celda[data-celda="b"]{grid-area:b}.cs-celda[data-celda="c"]{grid-area:c}.cs-celda[data-celda="d"]{grid-area:d}
.cs-celda[data-celda="e"]{grid-area:e}.cs-celda[data-celda="f"]{grid-area:f}.cs-celda[data-celda="g"]{grid-area:g}.cs-celda[data-celda="h"]{grid-area:h}

.cs-celda{position:relative;min-width:0;min-height:0;overflow:hidden;cursor:pointer;text-align:left;transform-origin:0 0;
  padding:18px 20px;border-radius:28px;border:1px solid var(--cs-edge);background:linear-gradient(180deg,var(--cs-cell2),var(--cs-cell));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);transition:border-color .35s,box-shadow .45s}
.cs-celda:hover{border-color:var(--cs-edge2)}
.cs-celda:focus-visible{outline:2px solid var(--cs-neon);outline-offset:2px}
.cs-celda[aria-pressed="true"]{border-color:rgba(61,255,143,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 0 1px rgba(61,255,143,.12),0 40px 90px -50px rgba(61,255,143,.45)}
.cs-in{height:100%;display:flex;flex-direction:column;gap:6px;min-height:0}
.cs-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:500;color:var(--cs-mut);flex:none}
.cs-h>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--cs-neon-soft);color:var(--cs-neon)}
.cs-badge.neg{background:rgba(255,90,79,.13);color:var(--cs-red)}
.cs-badge.mut{background:rgba(255,255,255,.07);color:var(--cs-mut)}
.cs-v{font-family:var(--display);font-size:clamp(1.55rem,2.5vw,2.35rem);font-weight:600;letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--cs-ink);flex:none;white-space:nowrap}
.cs-celda[aria-pressed="true"] .cs-v{font-size:clamp(2.1rem,4vw,3.5rem)}
.cs-v small{font-size:.42em;font-weight:500;letter-spacing:0;color:var(--cs-mut);margin-left:6px}
.cs-sub{font-size:12.5px;color:var(--cs-mut);flex:none}
.cs-viz{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:flex-end}
.cs-live{width:8px;height:8px;border-radius:50%;background:var(--cs-neon);box-shadow:0 0 10px var(--cs-neon);animation:csPulse 1.6s ease-in-out infinite}
@keyframes csPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.cs-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--cs-grey)}
.cs-dot.ok{background:var(--cs-neon);box-shadow:0 0 8px rgba(61,255,143,.7)}.cs-dot.warn{background:var(--cs-amber)}.cs-dot.bad{background:var(--cs-red)}

/* barras verticales */
.cs-bars{display:flex;align-items:flex-end;gap:6px;height:100%;min-height:40px}
.cs-bars>div{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.cs-bars i{display:block;width:100%;border-radius:7px 7px 3px 3px;background:var(--cs-dim);transform-origin:bottom;animation:csGrow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k)*35ms)}
.cs-bars i.on{background:linear-gradient(180deg,var(--cs-neon),var(--cs-neon-2));box-shadow:0 0 16px -4px rgba(61,255,143,.6)}
.cs-bars i.alt{background:#4a4a52}
.cs-bars em{font-style:normal;font-size:10.5px;color:var(--cs-mut);white-space:nowrap}
.cs-bars b{font-size:10.5px;font-weight:600;color:var(--cs-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.cs-bars .pair{flex-direction:row;align-items:flex-end;gap:3px}
.cs-bars .col{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;height:100%;gap:5px;min-width:0}
@keyframes csGrow{from{transform:scaleY(0)}}
.cs-svg{display:block;width:100%;height:100%;overflow:visible}

/* medidor radial segmentado */
.cs-gauge{position:relative;aspect-ratio:1;height:100%;max-height:100%;margin-inline:auto}
.cs-gauge svg{width:100%;height:100%;display:block}
.cs-gauge rect{transition:fill .5s}
.cs-gauge .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cs-gauge .ctr b{font-family:var(--display);font-size:clamp(1.1rem,2.6vw,2.6rem);font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cs-gauge .ctr span{font-size:11.5px;color:var(--cs-mut)}

/* barra segmentada de estado */
.cs-seg{display:flex;gap:4px;height:26px}
.cs-seg i{flex:1;border-radius:5px;background:var(--cs-dim);animation:csFade .5s ease both;animation-delay:calc(var(--k)*40ms)}
.cs-seg i.ok{background:var(--cs-neon);box-shadow:0 0 10px -2px rgba(61,255,143,.6)}.cs-seg i.warn{background:var(--cs-amber)}.cs-seg i.bad{background:var(--cs-red)}
@keyframes csFade{from{opacity:0;transform:translateY(6px)}}
.cs-chips{display:flex;flex-wrap:wrap;gap:6px}
.cs-chips span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.06);font-size:11.5px;color:var(--cs-ink)}

/* interruptor */
.cs-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cs-switch{appearance:none;position:relative;flex:none;width:52px;height:31px;border-radius:999px;border:0;background:#3a3a40;cursor:pointer;transition:background .35s}
.cs-switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .45s cubic-bezier(.32,.72,0,1)}
.cs-switch[aria-checked="true"]{background:var(--cs-neon);box-shadow:0 0 18px -4px rgba(61,255,143,.7)}
.cs-switch[aria-checked="true"]::after{transform:translateX(21px)}
.cs-switch:focus-visible{outline:2px solid var(--cs-neon);outline-offset:3px}
.cs-state{font-family:var(--display);font-size:clamp(1.25rem,2vw,1.8rem);font-weight:600;letter-spacing:-.02em}

/* lista de tareas */
.cs-list{display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0;scrollbar-width:thin;margin-right:-8px;padding-right:8px}
.cs-task{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 2px;font-size:13px;color:var(--cs-ink);border-radius:10px;cursor:pointer}
.cs-task:hover{background:rgba(255,255,255,.04)}
.cs-task .box{width:20px;height:20px;border-radius:6px;border:1.5px solid #4a4a52;display:grid;place-items:center;transition:background .25s,border-color .25s}
.cs-task .box svg{width:13px;height:13px;stroke:#08080a;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:opacity .25s,transform .35s cubic-bezier(.32,.72,0,1)}
.cs-task.done .box{background:var(--cs-neon);border-color:var(--cs-neon)}
.cs-task.done .box svg{opacity:1;transform:none}
.cs-task .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.cs-task.done .tx{color:var(--cs-mut);text-decoration:line-through}
.cs-task small{font-size:11px;color:var(--cs-mut);white-space:nowrap}
.cs-task .pr{width:6px;height:6px;border-radius:50%}
.cs-task .pr.a{background:var(--cs-red)}.cs-task .pr.m{background:var(--cs-amber)}.cs-task .pr.b{background:var(--cs-grey)}

/* mosaico de indicadores */
.cs-mos{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-content:end}
.cs-mos i{aspect-ratio:1;border-radius:4px;background:var(--cs-dim);animation:csFade .5s ease both;animation-delay:calc(var(--k)*18ms)}
.cs-mos i.full{background:var(--cs-neon)}.cs-mos i.part{background:var(--cs-amber)}
.cs-ind{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 2px;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.05)}
.cs-ind em{font-style:normal;font-size:10.5px;color:var(--cs-mut);font-family:var(--mono)}
.cs-ind b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.cs-ind b.na{color:var(--cs-mut);font-weight:500}
.cs-fam{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cs-neon);font-weight:600;margin:8px 0 2px}
.cs-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:none}
.cs-stats div{background:rgba(255,255,255,.045);border-radius:14px;padding:8px 11px}
.cs-stats span{display:block;font-size:11px;color:var(--cs-mut)}
.cs-stats b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.cs-note{font-size:12px;color:var(--cs-mut);line-height:1.45;flex:none}
.cs-lg{display:flex;gap:12px;font-size:11px;color:var(--cs-mut)}
.cs-lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

@media (max-width:980px){
  .cs-rejilla,.cs-rejilla[data-forma]{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;grid-auto-rows:minmax(170px,auto);grid-template-areas:none}
  .cs-celda{grid-area:auto!important}
  .cs-celda[aria-pressed="true"]{grid-column:1/-1;min-height:400px}
  .cs-side{align-items:flex-start}.cs-ctl{justify-content:flex-start}
}
@media (max-width:520px){.cs-rejilla,.cs-rejilla[data-forma]{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div class="app">

  <!-- Cabecera: marca, periodo y cifras clave -->
  <header class="flex flex-col gap-4 xl:flex-row xl:items-end xl:justify-between min-w-0">
    <div class="flex flex-col gap-3 min-w-0">
      <div class="flex items-center gap-4 min-w-0">
        <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z"/><path d="M5 19l7-7"/></svg></div>
        <span class="t-cuma">CUMA</span>
        <div class="t-stack"><span class="t-sub">ALPRODE 2.0 · EDEC EP</span><span class="t-main">Tablero de indicadores</span></div>
      </div>
      <div class="rsel" id="mes" role="group" aria-label="Periodo"></div>
    </div>
    <div class="flex items-end gap-3 min-w-0">
      <div class="flex flex-wrap gap-y-2 min-w-0">
        <div class="fig"><span>Ventas</span><b class="num" id="f-v">—</b><small id="f-vs">—</small></div>
        <div class="fig"><span>Transacciones</span><b class="num" id="f-n">—</b><small id="f-ns">—</small></div>
        <div class="fig"><span>Cobertura</span><b class="num" id="f-c">—</b><small id="f-cs">—</small></div>
      </div>
      <button class="icon-btn" id="theme" aria-label="Cambiar tema" title="Tema: automático"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
    </div>
  </header>

  <main class="stage">
    <!-- Mapa: menú por familia, tarjetas de indicador, carpetas -->
    <section class="map glass" id="map">

const pct = (v, d = 1) => v == null || !isFinite(v) ? '—' : (v < 0 ? '−' : '') + nf(Math.abs(v), d) + ' %';
const sgn = (v, d = 1) => v == null || !isFinite(v) ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + nf(Math.abs(v), d) + ' %';
const usd = (v, d = 0) => v == null || !isFinite(v) ? '—' : (v < 0 ? '−' : '') + '$ ' + nf(Math.abs(v), d);

/* ---------- cálculo (misma lógica que tendrá el backend) ---------- */

function calc(ii) {
  const n = ii.length, V = sum(M.ventas, ii), CV = sum(M.costo_ventas, ii), GO = sum(M.gastos, ii), COM = sum(M.comisiones, ii);
  const VP = sum(M.ventas_pos, ii), N = sum(M.transacciones, ii), MC = (V - CV - COM) / V, CF = (GO - COM) / n;
  return {V, CV, GO, n, N, mb: (V - CV) / V * 100, pgo: GO / V * 100, mo: (V - CV - GO) / V * 100, oss: V / (CV + GO) * 100,

/* ---------- utilidades visuales ---------- */
function spark(vals, sel) {
  const W = 200, H = 26, p = 3, xs = vals.map((_, i) => p + i * (W - 2 * p) / (vals.length - 1));
  const ok = vals.filter(v => v != null); if (ok.length < 2) return '';
  const lo = Math.min(...ok), hi = Math.max(...ok), sp = hi - lo || 1;
  const ys = vals.map(v => v == null ? null : H - p - (v - lo) / sp * (H - 2 * p));
  const pts = xs.map((x, i) => ys[i] == null ? null : [x, ys[i]]).filter(Boolean);
  const d = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('');
  const id = 'g' + Math.random().toString(36).slice(2, 8), si = sel == null ? vals.length - 1 : sel;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".2"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <path d="${d}L${pts[pts.length - 1][0]} ${H}L${pts[0][0]} ${H}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${ys[si] == null ? '' : `<circle cx="${xs[si]}" cy="${ys[si]}" r="2.8" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.7" vector-effect="non-scaling-stroke"/>`}</svg>`;
}
/* resaltado que se desliza bajo el botón activo (efecto de los menús del simulador) */
function slide(nav, instant) {

  if (!hl) { hl = document.createElement('i'); hl.className = 'hl'; nav.prepend(hl); }
  const b = nav.querySelector('button[aria-pressed="true"]');
  if (!b || !b.offsetWidth) { hl.classList.remove('on'); return; }
  hl.classList.toggle('anim', !instant && hl.classList.contains('on'));
  hl.style.transform = `translate(${b.offsetLeft}px,${b.offsetTop}px)`;
  hl.style.width = b.offsetWidth + 'px'; hl.style.height = b.offsetHeight + 'px';
  hl.classList.add('on');
  const l = b.offsetLeft - nav.scrollLeft;
  if (l < 0 || l + b.offsetWidth > nav.clientWidth) nav.scrollTo({left: b.offsetLeft - 24, behavior: 'smooth'});
}
function menu(nav, items, cur, onPick, lead = '') {
  nav.innerHTML = lead + items.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${v === cur}">${l}</button>`).join('');

}

    const show = x ? items : items.slice(0, 5);
    return `<div class="cs-h"><span>Datos pendientes</span><span class="cs-badge mut">${HECHOS.size}/${D.faltan.length}</span></div>
      <div class="cs-list" style="flex:1;margin-top:4px">${show.map(({f, i}) => `<div class="cs-task ${HECHOS.has(i) ? 'done' : ''}" data-t="${i}" role="checkbox" aria-checked="${HECHOS.has(i)}" tabindex="0">
        <span class="box">${CHECK}</span><span class="tx">${f[0]}</span>${x ? `<small>${f[1]} · ${f[3]}</small>` : `<span class="pr ${f[2]}"></span>`}</div>`).join('')}</div>
      ${x ? '<p class="cs-note">Marca un dato cuando CUMA lo entregue. Rojo: prioridad alta; ámbar: media; gris: baja.</p>' : ''}`;
  },
  g(x) {  // Margen bruto y gasto
    const {r} = R, mb = series(c => c.mb), go = series(c => c.pgo);
    return `<div class="cs-h"><span>Margen bruto y gasto</span><span class="cs-badge mut">% de ventas</span></div>
      <div class="cs-row" style="justify-content:flex-start;gap:18px;align-items:baseline"><div class="cs-v" data-n="${r.mb}" data-f="pct">${pct(r.mb)}</div><span class="cs-sub">gasto ${pct(r.pgo)} · margen op. ${pct(r.mo)}</span></div>
      <div class="cs-viz" style="margin-top:${x ? 10 : 4}px">${csPairs(mb.map(v => Math.max(0, v)), go, x ? PER.map(lbl) : null, x)}</div>
      ${x ? `<div class="cs-lg" style="margin-top:8px"><span><i style="background:#3dff8f"></i>Margen bruto</span><span><i style="background:#4a4a52"></i>Gasto operativo</span><span>El gasto supera al margen en todos los meses</span></div>` : ''}`;
  },
  h(x) {  // Sistema de indicadores
    const cb = D.cobertura, tot = cb.completos + cb.parciales + cb.sin_datos;
    return `<div class="cs-h"><span>Indicadores</span><span class="cs-badge">${cb.completos + cb.parciales}/${tot}</span></div>
      ${x ? `<div class="cs-list" style="flex:1">${['C', 'F', 'O', 'A'].map(f => `<div class="cs-fam">${FAM_L[f]}</div>${IND.filter(i => i.f === f).map(i => `<div class="cs-ind"><span class="cs-dot ${i.e === 'full' ? 'ok' : i.e === 'part' ? 'warn' : ''}"></span><span>${i.id} · ${i.n}</span><b class="${V[i.id].txt ? 'na' : ''}">${V[i.id].v}</b></div>`).join('')}`).join('')}</div>`
        : `<div class="cs-v" data-n="${cb.completos}" data-f="nf">${cb.completos}<small>completos · ${cb.parciales} parciales</small></div>
           <div class="cs-viz"><div class="cs-mos">${IND.map((i, k) => `<i class="${i.e}" style="--k:${k}" title="${i.id} · ${i.n}"></i>`).join('')}</div></div>`}`;
  }
};

function csFill() {
  document.querySelectorAll('.cs-celda').forEach(c => {
    const k = c.dataset.celda;
    c.querySelector('.cs-in').innerHTML = CELDAS[k](CS.act === k);
  });
  $('cs-per').textContent = R.acum ? `Tablero de ${perTxt()}` : `Tablero de ${lblL(S.mes)} 2026`;
  // contadores: animan desde el valor anterior
  const F = {usd: v => usd(v), nf: v => nf(v), pct: v => pct(v)};
  document.querySelectorAll('.cs-v[data-n]').forEach(el => {
    const key = el.closest('.cs-celda').dataset.celda, to = +el.dataset.n, from = CS.prev[key] ?? to * .6, f = F[el.dataset.f];
    CS.prev[key] = to;
    if (from === to || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const tail = el.querySelector('small') ? el.querySelector('small').outerHTML : '', t0 = performance.now();
    const step = now => { const p = Math.min(1, (now - t0) / 700), e = 1 - Math.pow(1 - p, 3);
      el.innerHTML = f(from + (to - from) * e) + tail; if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  const sw = $('cs-sw');
  if (sw) sw.onclick = e => { e.stopPropagation(); setInicio(PER[0] === D.inicio_costo_real ? D.meses[0] : D.inicio_costo_real); };
  document.querySelectorAll('.cs-task').forEach(t => {
    const tog = e => { e.stopPropagation(); const i = +t.dataset.t; HECHOS.has(i) ? HECHOS.delete(i) : HECHOS.add(i);
      try { localStorage.setItem('cuma-datos-recibidos', JSON.stringify([...HECHOS])); } catch (er) {}
      t.classList.toggle('done', HECHOS.has(i)); t.setAttribute('aria-checked', HECHOS.has(i));
      t.closest('.cs-celda').querySelector('.cs-badge').textContent = `${HECHOS.size}/${D.faltan.length}`; };
    t.onclick = tog; t.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tog(e); } };
  });
}
/* FLIP: primero se miden las celdas, se cambia la forma de la rejilla, se mide de nuevo y se anima la diferencia */
function csPick(k) {
  const grid = $('cs-rejilla'), cells = [...grid.children], first = new Map(cells.map(c => [c, c.getBoundingClientRect()]));
  CS.act = CS.act === k ? null : k;
  grid.dataset.forma = CS.act || '';
  cells.forEach(c => c.setAttribute('aria-pressed', c.dataset.celda === CS.act));
  csFill();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cells.forEach(c => {
    const f = first.get(c), l = c.getBoundingClientRect();
    if (!l.width || !f.width) return;
    const dx = f.left - l.left, dy = f.top - l.top, sx = f.width / l.width, sy = f.height / l.height;
    if (Math.abs(dx) + Math.abs(dy) < 1 && Math.abs(sx - 1) + Math.abs(sy - 1) < .01) return;
    c.animate([{transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})`}, {transform: 'none'}], {duration: 620, easing: 'cubic-bezier(.32,.72,0,1)'});
    c.querySelector('.cs-in').animate([{opacity: 0}, {opacity: 0, offset: .35}, {opacity: 1}], {duration: 620, easing: 'ease-out'});
  });
}
document.querySelectorAll('.cs-celda').forEach(c => {
  c.addEventListener('click', () => csPick(c.dataset.celda));
  c.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === c) { e.preventDefault(); csPick(c.dataset.celda); } });
});

/* ---------- periodo compartido por las dos vistas ---------- */
const enCasillero = () => document.body.dataset.vista === 'casillero';
function refresh() {
  compute(); renderHeader();
  if (enCasillero()) { csFill(); return; }
  renderView();
  if (S.deck) { if (S.card != null) pickCard(S.card); } else swap($('pin'), renderPanel);
}
function buildMes() {
  const items = [['acum', `${lbl(PER[0])} – ${lbl(PER[PER.length - 1]).toLowerCase()}<small>${PER[0].slice(0, 4) === PER[PER.length - 1].slice(0, 4) ? PER[0].slice(0, 4) : ''}</small>`], ...PER.map(k => [k, lbl(k)])];
  const pickMes = v => { S.mes = v; ['mes', 'cs-mes'].forEach(id => { const n = $(id); n.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); slide(n); }); refresh(); };
  menu($('mes'), items, S.mes, pickMes, '<span>Periodo</span>');
  menu($('cs-mes'), items, S.mes, pickMes, '<span>Periodo</span>');
}
function setInicio(k) {
  PER = D.meses.slice(ix(k));
  if (S.mes !== 'acum' && !PER.includes(S.mes)) S.mes = 'acum';
  buildMes(); refresh();
}

/* ---------- arranque y eventos ---------- */
buildMes();
menu($('fam'), Object.entries(FAM), S.fam, v => {
  S.fam = v; S.sel = null;
  swap($('view'), renderView);
  swap($('sub'), renderSub);
  swap($('pin'), renderPanel);
});
$('dtoggle').onclick = () => { if (S.deck) { closeDeck(); swap($('pin'), renderPanel); } else openDeck(); };
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (enCasillero()) { if (CS.act) csPick(CS.act); return; }
  if (S.deck) { if (S.card != null) pickCard(null); else { closeDeck(); swap($('pin'), renderPanel); } }
});
addEventListener('resize', () => document.querySelectorAll('.rsel,.gb,.il').forEach(n => slide(n, true)));

/* tema: automático → claro → oscuro; el oscuro usa la vista Casillero */
const THEMES = ['auto', 'light', 'dark'], TL = {auto: 'automático', light: 'claro', dark: 'oscuro'};
let theme = 'auto';
try { theme = localStorage.getItem('cuma-theme') || 'auto'; } catch (e) {}
const oscuro = () => theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
const applyTheme = () => {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme;
  document.body.dataset.vista = oscuro() ? 'casillero' : 'panel';
  $('theme').title = $('cs-theme').title = 'Tema: ' + TL[theme];
};
const repaint = () => {
  applyTheme(); defaults(); compute(); renderHeader();
  if (enCasillero()) csFill(); else { renderView(); renderSub(); renderPanel(); if (S.deck && S.card != null) pickCard(S.card); }
  requestAnimationFrame(() => document.querySelectorAll('.rsel,.gb,.il').forEach(n => slide(n, true)));
};
const nextTheme = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; try { localStorage.setItem('cuma-theme', theme); } catch (e) {} repaint(); };
$('theme').onclick = nextTheme; $('cs-theme').onclick = nextTheme;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (theme === 'auto') repaint(); });

repaint();
})();
</script>
