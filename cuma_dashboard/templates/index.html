/* Gramática de Corbatul Twin: una sola página, mapa a la izquierda (menú por familia, tarjetas bento que se agrandan

:root{
  --bg:#fdfdfd; --surface:#f8f8f8; --surface2:#efefef; --ink:#2c2c2e; --ink-strong:#111111;

  --dedge:rgba(0,0,0,.12); --dglass:transparent; --dscrim:rgba(253,253,253,.18);

  --lens:linear-gradient(180deg,#fff,rgba(255,255,255,.72));
  --lens-shadow:inset 0 1px 1px #fff,inset 0 -2px 5px rgba(255,255,255,.6),inset 0 0 0 .5px rgba(0,0,0,.06),0 8px 18px -8px rgba(20,22,30,.38),0 1px 2px rgba(20,22,30,.14);
  --depth:0 0 #0000;
  --float:0 0 #0000;

}

*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-10vmax;z-index:-1;pointer-events:none;
  background:radial-gradient(34vmax 30vmax at 6% 12%,var(--blob-a),transparent 70%),
             radial-gradient(38vmax 32vmax at 52% 0%,var(--blob-b),transparent 70%),
             radial-gradient(36vmax 30vmax at 98% 30%,var(--blob-c),transparent 70%),
             radial-gradient(40vmax 34vmax at 70% 104%,var(--blob-d),transparent 70%),
             radial-gradient(34vmax 30vmax at 12% 100%,var(--blob-b),transparent 70%)}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{--gutter:clamp(16px,1.6vw,28px);max-width:1680px;margin-inline:auto;
  padding:16px var(--gutter) 56px}

/* ---------- barra superior: marca y cuatro íconos a la izquierda · luz, buscar y ajustes a la derecha ---------- */
.top{position:sticky;top:12px;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;pointer-events:none}
.tbar{display:flex;align-items:center;gap:2px}
.tbtn{appearance:none;position:relative;display:grid;place-items:center;width:44px;height:44px;flex:none;border:0;border-radius:50%;background:transparent;color:var(--ink-strong);cursor:pointer;transition:background-color .3s cubic-bezier(.2,0,0,1),box-shadow .3s cubic-bezier(.2,0,0,1)}
.tbtn .ico{width:20px;height:20px}
.tbtn:hover,.tbtn:focus-visible,.tbtn[aria-expanded="true"]{background:var(--glass-flat);outline:none}
.tbtn[aria-pressed="true"]{background:var(--lens);box-shadow:var(--lens-shadow)}
.tbtn .tbtn__dot{position:absolute;top:9px;right:9px}
.tbtn .tip{position:absolute;top:calc(100% + 12px);left:50%;padding:6px 10px;border-radius:10px;background:var(--pop-solid);color:var(--ink-strong);box-shadow:var(--float);font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-4px);transition:opacity .2s cubic-bezier(.2,0,0,1),transform .3s cubic-bezier(.2,0,0,1)}
.tbtn:hover .tip,.tbtn:focus-visible .tip{opacity:1;transform:translate(-50%,0)}
.tbtn[aria-expanded="true"] .tip{opacity:0}
.top .ico--sun{display:none}
:root[data-theme="night-edition"] .top .ico--sun{display:block}:root[data-theme="night-edition"] .top .ico--moon{display:none}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;padding:4px 12px 10px;font-size:12.5px;color:var(--muted)}
.keys kbd{font:600 11px var(--font);border:1px solid var(--line);border-radius:7px;padding:2px 7px;color:var(--ink);justify-self:start}
.top>*{pointer-events:auto}
.chrome{position:relative;border-radius:4px;background:var(--chrome-bg);-webkit-backdrop-filter:blur(12px) saturate(150%);backdrop-filter:blur(12px) saturate(150%);box-shadow:var(--depth),var(--float)}
.brand{position:relative;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 13px 0 15px;margin-right:6px;border:1.5px solid var(--accent);border-radius:999px;color:var(--accent);text-decoration:none;transition:background-color .3s cubic-bezier(.2,0,0,1)}
.brand:hover,.brand:focus-visible{background:var(--accent-soft);outline:none}
.brand__word{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:700;letter-spacing:.05em;line-height:1;-webkit-text-stroke:.5px currentColor}
.brand svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}


.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.01em}
.badge.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:color-mix(in srgb,var(--ok) 60%,var(--ink-strong))}
.badge.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:color-mix(in srgb,var(--warn) 45%,var(--ink-strong))}
.badge.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:color-mix(in srgb,var(--bad) 75%,var(--ink-strong))}
.badge.na{background:var(--glass-flat);color:var(--ink)}

/* ---------- menús emergentes de vidrio y buscador ---------- */
.pop{position:fixed;z-index:80;min-width:250px;overflow-x:hidden;max-width:min(360px,calc(100vw - 24px));max-height:min(70vh,560px);overflow:auto;padding:6px;border-radius:4px;
  background:var(--pop-bg);-webkit-backdrop-filter:blur(30px) saturate(150%);backdrop-filter:blur(30px) saturate(150%);box-shadow:var(--depth),0 24px 60px -18px rgba(10,20,40,.35);scrollbar-width:thin}
.pop hr{height:1px;margin:4px 8px;border:0;background:var(--line)}
.pop__head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px 6px;font-weight:700;color:var(--ink-strong)}
.pop__sub{padding:8px 12px 2px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pop__head small{font-weight:500;color:var(--muted);font-size:12px}
.menu__item{appearance:none;display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:4px;background:transparent;text-align:left;font-size:13.5px;font-weight:600;color:var(--ink-strong);cursor:pointer}
.menu__item:hover,.menu__item:focus-visible{background:var(--glass-flat);outline:none}
.menu__item .tema__sw{width:30px;height:20px;flex:none}
.menu__item small{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.menu__item .ck{margin-left:auto;width:16px;height:16px;fill:none;stroke:var(--ok);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.menu__item small+.ck{margin-left:8px}
.menu__item.mrow{cursor:default;gap:16px}.menu__item.mrow:hover{background:transparent}
.finder__bar input::-webkit-search-cancel-button{display:none}
.menu__item .lead{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:50%;background:var(--glass-flat)}
.menu__item .lead svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.finder{width:min(620px,calc(100vw - 24px));max-height:none;margin:12vh auto auto;padding:0;border:0;border-radius:4px;color:var(--ink);overflow:visible;
  background:var(--pop-bg);-webkit-backdrop-filter:blur(30px) saturate(150%);backdrop-filter:blur(30px) saturate(150%);box-shadow:var(--depth),0 30px 80px -20px rgba(10,20,40,.4)}
.finder::backdrop{background:rgba(12,14,18,.22);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.finder__bar{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);color:var(--muted)}
.finder__bar input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-size:17px;color:var(--ink-strong)}
.finder__bar kbd{font:600 11px var(--font);border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--muted)}
.finder__list{max-height:52vh;overflow:auto;padding:8px;scrollbar-width:thin}
.finder__group{padding:10px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.finder__opt{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:4px;cursor:pointer}
.finder__opt[aria-selected="true"]{background:var(--glass-flat)}
.finder__opt .lead{display:grid;place-items:center;width:36px;height:36px;flex:none;border-radius:50%;background:var(--glass-flat);font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--muted)}
.finder__opt b{display:block;font-weight:600;color:var(--ink-strong)}
.finder__opt small{display:block;font-size:12px;color:var(--muted)}
.finder__opt .dot{margin-left:auto}
.finder__empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* ---------- menús con resaltado deslizante ---------- */
.hm-mode{border-radius:4px;background:var(--glass-flat);box-shadow:inset 0 0 0 1px var(--rim-lo)}
.gb{position:relative;display:flex;flex-wrap:nowrap;justify-content:center;gap:3px;padding:4px;isolation:isolate;max-width:100%;overflow-x:auto;scrollbar-width:none}
.gb::-webkit-scrollbar{display:none}
.gb button{appearance:none;margin:0;position:relative;z-index:1;cursor:pointer;background:transparent;border:0;border-radius:4px;padding:8px 16px;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;transition:color .45s var(--spring),background-color .2s}
:root[data-theme="night-edition"] .gb button{color:var(--ink)}
.gb button:hover,.gb button[aria-pressed="true"]{color:var(--ink-strong)}
.gb button:not([aria-pressed="true"]):hover{background:var(--glass-flat)}
/* lente: los bordes izquierdo y derecho viajan a ritmos distintos y al llegar rebota como gelatina */
.hl{position:absolute;left:0;top:0;z-index:0;pointer-events:none;opacity:0;border-radius:4px;background:var(--lens);box-shadow:var(--lens-shadow);transition:opacity .3s;will-change:left,width,transform}
.hl.on{opacity:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ---------- escenario ---------- */
.stage{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:var(--gap,16px);align-items:start}
.left{min-width:0}
.left>.sema{margin-bottom:12px;padding:14px 16px}
.sema__t{margin:0 0 8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--gold)}
.left .dstack{display:none}
.stage.dk .bento{display:none}.stage.dk .left .dstack{display:block}
/* la ficha: tarjetas sueltas sobre el fondo, fija mientras se recorre la rejilla */
.side{position:sticky;top:96px;max-height:calc(100dvh - 112px);overflow-y:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:14px;min-width:0;padding:8px;margin:-8px}
.dbody{display:flex;flex-direction:column;gap:12px;min-width:0}
/* mapa de calor día × hora */
.hm-mode{padding:3px}
.hm-mode button{padding:5px 12px;font-size:11.5px;text-transform:none;letter-spacing:0}
.hm{display:grid;grid-template-columns:42px repeat(7,minmax(0,1fr)) 74px;gap:4px;align-items:center;margin-top:4px}
.hm .tt.tc{text-align:center;font-size:10px}
.hm .hh{font-size:10px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.hm .hh:last-child{text-align:right}
.hm .rl{font-size:11px;font-weight:600;color:var(--muted)}
.hm .c{position:relative;height:24px;border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;cursor:pointer;
  transition:transform .35s var(--spring),box-shadow .3s;animation:hmIn .5s var(--ease) backwards;animation-delay:calc(var(--k,0)*6ms)}
.hm .c.hi{color:#fff}
.hm .c.pk{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ok)}
.hm .c:hover{transform:scale(1.14);z-index:2;box-shadow:0 8px 18px -8px var(--glass-shadow)}
.hm .c.off{cursor:default;background:repeating-linear-gradient(135deg,var(--glass-flat) 0 3px,transparent 3px 7px)}
.hm .c.off:hover{transform:none;box-shadow:none}
.hm .tt{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-strong);text-align:right}
@keyframes hmIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.hm-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.hm-info{font-size:12px;color:var(--ink);min-height:18px}
.hm-lg{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted)}
.hm-lg em{font-style:normal}
.hm-lg i{display:block;width:90px;height:8px;border-radius:2px;background:linear-gradient(90deg,color-mix(in srgb,var(--ok) 8%,transparent),var(--ok))}
.card,.side>.phead,.side>.sec,.side>.note,.side>.empty-st,.side>.dbody,.side>.cgs>.cg{position:relative;border:0;border-radius:4px;padding:18px 20px;
  background:linear-gradient(172deg,var(--sheen) 0%,transparent 34%),var(--card-bg);-webkit-backdrop-filter:blur(12px) saturate(150%);backdrop-filter:blur(12px) saturate(150%);box-shadow:var(--depth),var(--float)}
.side>.cgs{display:flex;flex-direction:column;gap:14px}
.glass{position:relative;-webkit-backdrop-filter:blur(12px) saturate(150%);backdrop-filter:blur(12px) saturate(150%);box-shadow:var(--depth),var(--float);background:var(--card-bg)}
/* borde de las tarjetas: una línea fina y continua de un solo color (máscara que deja ver 1 px) */
.glass::before,.chrome::before,.tile::before,.dli::before,.card::before,.side>.phead::before,.side>.sec::before,.side>.note::before,.side>.dbody::before,.side>.cgs>.cg::before,.pop::before,.finder::before{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;pointer-events:none;padding:1px;
  background:var(--rim-line);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.tile.more::before{display:none}
/* ondas al tocar */
.ripple-wrap{position:absolute;inset:0;z-index:2;border-radius:inherit;overflow:hidden;pointer-events:none}
.ripple{position:absolute;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,transparent 38%,var(--rip,var(--ripple)) 62%,transparent 72%)}
.dot{--c:var(--na);--h:var(--na-halo);position:relative;flex:none;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--h);transition:background-color .3s,box-shadow .3s}
.dot::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);opacity:0;animation:breath 3.4s cubic-bezier(.45,0,.25,1) infinite}
.dot.ok{--c:var(--ok);--h:var(--ok-halo)}.dot.warn{--c:var(--warn);--h:var(--warn-halo)}.dot.bad{--c:var(--bad);--h:var(--bad-halo)}
.dot.na::before{display:none}
.dot.sm{width:7px;height:7px;box-shadow:0 0 0 2px var(--h)}.dot.sm::before{display:none}
@keyframes breath{0%,100%{transform:scale(1);opacity:0}18%{opacity:.38}55%{transform:scale(2.5);opacity:0}}
/* ---------- rejilla bento: la tarjeta tocada se agranda y el resto se reacomoda (FLIP) ---------- */
.bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(118px,auto);grid-auto-flow:row dense;gap:12px}
.tile{appearance:none;position:relative;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:0;text-align:left;cursor:pointer;overflow:hidden;
  padding:12px 13px 11px;border-radius:4px;border:0;background:transparent;transform-origin:0 0;
  transition:background .3s,border-color .3s,box-shadow .35s}
.tile{--st:var(--na);--chart:var(--st);background:color-mix(in srgb,var(--st) 7%,transparent);box-shadow:var(--depth);
  --rim-line:transparent;--rim-hi:color-mix(in srgb,var(--st) 85%,transparent);--rim-mid:color-mix(in srgb,var(--st) 50%,transparent);--rim-lo:color-mix(in srgb,var(--st) 18%,transparent);--rip:color-mix(in srgb,var(--st) 40%,transparent)}
.tile[data-st="ok"]{--st:var(--ok)}.tile[data-st="warn"]{--st:var(--warn)}.tile[data-st="bad"]{--st:var(--bad)}
.tile[data-st="na"]{--st:var(--muted);background:color-mix(in srgb,var(--ink) 4%,transparent)}
.tile:hover{background:color-mix(in srgb,var(--st) 12%,transparent)}
.tile .t-id{display:flex;align-items:center;gap:6px}
.tile .t-st{font-family:var(--font);font-size:10px;font-weight:600;letter-spacing:0;color:color-mix(in srgb,var(--st) 75%,var(--ink-strong))}
.tile.big{grid-column:span 2;grid-row:span 2;background:color-mix(in srgb,var(--st) 10%,transparent);box-shadow:none;padding:15px 17px 13px;
  --rim-line:transparent;--rim-hi:var(--st);--rim-mid:color-mix(in srgb,var(--st) 70%,transparent);--rim-lo:color-mix(in srgb,var(--st) 30%,transparent)}
.tile .t-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tile .t-id{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted)}
.tile .t-n{font-size:12px;font-weight:600;color:var(--ink);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .t-v{font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--ink-strong);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tile .t-v.txt{font-size:15px;font-weight:600;color:var(--muted)}
.tile .t-v small{font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted);margin-left:6px}
.tile .t-s{font-size:12px;color:var(--muted);line-height:1.4}
.tile .t-viz{margin-top:auto;padding-top:6px;min-height:0}
.tile.big .t-n{font-size:13px;white-space:normal}
.tile.big .t-v{font-size:24px}
.tile.big .t-viz{flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-end}
.tile svg.spark{display:block;width:100%;height:24px;overflow:visible}
.tile.big svg.spark{height:100%;min-height:60px;max-height:150px}
.tile .axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px}
.tile .bar{height:5px;border-radius:2px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.tile .bar i{display:block;height:100%;border-radius:2px;background:var(--chart)}
.tile .bar.void{background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--ink) 10%,transparent) 0 5px,transparent 5px 9px)}
.tile .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tile.more{align-items:flex-start;justify-content:center;border:0;box-shadow:none;background:color-mix(in srgb,var(--ink) 4%,transparent)}
.tile.more .t-v{font-size:20px}
.tile.more:hover{border-color:var(--muted)}
/* entrada: la tarjeta se abre desde el centro (recorte) mientras sube, y su contenido aparece en cascada */
.tile.enter{animation:tileIn .75s var(--expo) both;animation-delay:calc(var(--j,0)*45ms)}
.tile.enter>:not(.ripple-wrap){animation:kidIn .4s var(--out3) both;animation-delay:calc(var(--j,0)*45ms + 50ms + var(--c,0)*30ms)}
.tile.enter>:nth-child(2){--c:1}.tile.enter>:nth-child(3){--c:2}.tile.enter>:nth-child(4){--c:3}.tile.enter>:nth-child(5){--c:4}.tile.enter>:nth-child(6){--c:5}
@keyframes tileIn{from{clip-path:inset(15% 15% round 16px);transform:translateY(22px) scale(.975)}to{clip-path:inset(-40px round 56px);transform:none}}
@keyframes kidIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:4px;font-size:10.5px;font-weight:600;white-space:nowrap}
.tag.full{background:var(--accent-soft);color:var(--accent)}
.tag.part{background:color-mix(in srgb,var(--warn) 18%,transparent);color:color-mix(in srgb,var(--warn) 50%,var(--ink-strong))}
.tag.none{background:var(--glass-flat);color:var(--muted)}
.grp-h{grid-column:1/-1;margin:8px 2px 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:10px}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}

.chev{flex:none;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s var(--ease)}
/* ---------- ficha (panel derecho, como el simulador) ---------- */
.pill-btn{appearance:none;display:inline-flex;align-items:center;gap:7px;border:0;border-radius:4px;padding:7px 14px 7px 11px;background:var(--glass-flat);font-size:12.5px;font-weight:600;color:var(--ink-strong);cursor:pointer;transition:background .2s}
.pill-btn:hover{background:var(--line)}
.pill-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.phead{display:flex;flex-direction:column;gap:6px}
.kind{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:8px}
.side h2{margin:0;font-weight:600;font-size:1.3rem;line-height:1.2;color:var(--ink-strong);text-wrap:balance}
.side p{margin:0;color:var(--muted)}
.note{background:var(--accent-soft);color:var(--ink);font-size:12.5px;line-height:1.45}
.sec{display:flex;flex-direction:column;gap:7px;min-width:0}
.sec h3{margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tbl{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:4px 18px;padding:8px 0;border-top:1px solid var(--line-soft);align-items:baseline}
.row:first-child{border-top:0;padding-top:0}
.row .n{min-width:0;color:var(--muted);font-size:12px;letter-spacing:.01em}
.row .v{min-width:0;font-family:var(--mono);font-size:15px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-strong)}
.row .v.t{font-family:var(--font);font-size:13px;font-weight:400;color:var(--ink);text-align:right}
.row-long{grid-template-columns:1fr;gap:5px}
.row-long .v{text-align:left}
.cgs{display:flex;flex-direction:column;gap:8px}
.cg{position:relative;background:transparent;border:0;border-radius:4px;padding:11px 13px;min-width:0;box-shadow:var(--depth)}
.cg h4{margin:0 0 8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--gold);display:flex;justify-content:space-between;gap:8px;align-items:center}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.lg i.dash{width:12px;height:0;border-radius:0;border-top:2px dashed currentColor;vertical-align:3px}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tl.x4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tl>div{background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:4px;padding:7px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tl span{font-size:10.5px;color:var(--muted)}
.tl b{font-size:15px;font-weight:700;color:var(--ink-strong);letter-spacing:-.01em;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl em{font-style:normal;font-size:11px;color:var(--muted)}
.big{font-size:20px;font-weight:700;color:var(--ink-strong);letter-spacing:-.02em}
.big small{font-size:12px;font-weight:500;color:var(--muted);margin-left:8px;letter-spacing:0}
.pr{margin-top:7px}.pr:first-of-type{margin-top:0}
.pr .l{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink);margin-bottom:3px}
.pr .l b{color:var(--ink-strong);font-weight:600;white-space:nowrap}
.trk{height:6px;border-radius:2px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.trk i{display:block;height:100%;border-radius:2px;background:var(--c);width:calc(var(--w)*100%);transform-origin:left;animation:grow .8s var(--ease) both calc(var(--k,0)*60ms)}
@keyframes grow{from{transform:scaleX(0)}}
.seg{display:flex;gap:3px;height:10px;margin-bottom:8px}
.seg i{flex:1;border-radius:2px;background:var(--c)}
.vbars{display:flex;align-items:flex-end;gap:6px;height:118px}
.vbars>div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.vbars i{display:block;width:100%;max-width:30px;border-radius:4px 6px 3px 3px;background:var(--c,var(--chart-2));transform-origin:bottom;animation:growY .8s var(--ease) both calc(var(--k)*50ms)}
.vbars b{font-size:9.5px;font-weight:600;white-space:nowrap;letter-spacing:-.01em;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.vbars em{font-style:normal;font-size:10px;color:var(--muted)}
@keyframes growY{from{transform:scaleY(0)}}
.chart{position:relative;width:100%}
.formula{padding:14px;border-radius:4px;background:var(--glass-flat);text-align:center;font-family:'Times New Roman',Georgia,serif;font-size:17px;color:var(--ink-strong);overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px}
.fr>span{padding:0 4px}.fr>span:first-child{border-bottom:1px solid currentColor;padding-bottom:2px}.fr>span:last-child{padding-top:2px}
.formula sub,.formula sup{font-size:.62em}
.src{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.src span{padding:2px 9px;border-radius:4px;font-size:11px;font-weight:500;font-family:var(--font);background:var(--glass-flat);color:var(--muted)}
.src span.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.empty-st{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 14px;border-radius:4px;border:0;text-align:center;color:var(--muted);font-size:12px}
.switch{appearance:none;position:relative;flex:none;width:44px;height:26px;border-radius:4px;border:0;background:color-mix(in srgb,var(--ink) 22%,transparent);cursor:pointer;transition:background .3s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .45s var(--spring)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* lista de tarjetas de datos en la ficha (igual que el simulador) */
.dstack{position:relative;height:calc(var(--n)*56px + 28px);margin-top:4px}
.dli{appearance:none;position:absolute;left:0;right:0;top:calc(var(--j)*56px);height:84px;z-index:calc(var(--j) + 1);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-content:start;align-items:center;width:100%;text-align:left;padding:14px 18px 0;border:0;border-radius:4px;background:var(--dglass);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);box-shadow:none;color:var(--ink);cursor:pointer;font:inherit;transform-origin:50% 0;transform:scale(calc(.94 + var(--j)*.0085));transition:translate .25s ease;animation:dliIn .55s var(--ease) both;animation-delay:calc(var(--j)*45ms)}
@keyframes dliIn{from{opacity:0;transform:translateY(34px) scale(.92)}to{opacity:1;transform:scale(calc(.94 + var(--j)*.0085))}}
.dli:hover{translate:0 -4px}
.dli .dlt{grid-column:1;font-size:14px;font-weight:600;color:var(--ink-strong)}
.dli .dls{grid-column:1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dli .chev{grid-column:2;grid-row:1/3;opacity:.7}
.dli:hover .dlt{color:var(--accent)}
.dli.cur .dlt{color:var(--accent)}

/* tablas de las tarjetas */
.dt-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.dt-tbl th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted);text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt-tbl th:first-child,.dt-tbl td:first-child{text-align:left;font-family:var(--font)}
.dt-tbl td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dt-tbl tbody tr:hover td{background:var(--glass-flat)}
.dt-tbl tr.ref td{color:var(--muted)}
.dt-tbl tr.tot td{font-weight:600;color:var(--ink-strong);background:var(--glass-flat)}
.dt-tbl tr.sel td{background:var(--accent-soft)}
.dt-tbl td.neg{color:var(--neg)}
.dt-tbl td.w{white-space:normal;font-family:var(--font);text-align:left}
.cap{margin:10px 0 0;font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--muted)}
.prio{display:inline-block;padding:1px 8px;border-radius:4px;font-size:10.5px;font-weight:600;font-family:var(--font)}
.prio.a{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.prio.m{background:color-mix(in srgb,var(--warn) 18%,transparent);color:color-mix(in srgb,var(--warn) 50%,var(--ink-strong))}
.prio.b{background:var(--glass-flat);color:var(--muted)}
.chk{appearance:none;width:18px;height:18px;border-radius:4px;border:1.5px solid var(--muted);display:grid;place-items:center;cursor:pointer;background:transparent;padding:0;transition:background .2s,border-color .2s}
.chk svg{width:12px;height:12px;fill:none;stroke:var(--bg);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s var(--spring)}
.chk[aria-checked="true"]{background:var(--ink-strong);border-color:var(--ink-strong)}
.chk[aria-checked="true"] svg{opacity:1;transform:none}
tr.done td.w{color:var(--muted);text-decoration:line-through}
.dfit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}

.side>.note{background:var(--accent-soft)}
.dbody .cg::before{display:none}
.dbody .cg{background:var(--glass-flat);border-radius:4px;padding:11px 13px;box-shadow:none}

/* ---------- pantallas pequeñas ---------- */
@media (max-width:1180px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:980px){.bento{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stage{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none;overflow:visible;padding:0;margin:0}}
@media (max-width:760px){
  .app{padding:10px 12px calc(32px + env(safe-area-inset-bottom))}
  .top{gap:8px;top:8px;margin-bottom:18px}
  .tbar{gap:1px}
  .tbtn{width:38px;height:38px}.tbtn .tbtn__dot{top:7px;right:7px}.brand{height:36px;padding:0 10px 0 12px;margin-right:4px}.brand__word{font-size:19px}.brand svg{width:17px;height:17px}
  .tbtn .tip{display:none}
}
@media (max-width:420px){.tbtn{width:34px;height:34px}.tbtn .ico{width:19px;height:19px}.tbtn .tbtn__dot{top:6px;right:6px}.tbar{gap:0}.brand{height:34px;padding:0 8px 0 10px;margin-right:2px}.brand__word{font-size:17px}.brand svg{width:15px;height:15px}}
@media (max-width:640px){
  .bento{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tl.x4{grid-template-columns:1fr 1fr}.dfit{grid-template-columns:minmax(0,1fr)}
  .card,.side>.phead,.side>.sec,.side>.note,.side>.empty-st,.side>.dbody,.side>.cgs>.cg{padding:16px}
}

/* opciones desplegables de la ficha (resumen, semáforo, fórmula, ficha) */
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{appearance:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:4px;padding:7px 12px;background:var(--glass-flat);color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer;transition:background .25s,color .25s}
.opt:hover{color:var(--ink-strong)}
.opt svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--spring)}
.opt[aria-expanded="true"]{background:var(--ink-strong);color:var(--bg)}
.opt[aria-expanded="true"] svg{transform:rotate(180deg)}
.fold{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .45s var(--spring),opacity .3s ease}
.fold.open{grid-template-rows:1fr;opacity:1}
.fold>div{overflow:hidden;min-height:0}
.fold-in{display:flex;flex-direction:column;gap:8px;padding-top:14px}
.fold-in>p{margin:0;color:var(--ink);font-size:13px;line-height:1.5}
.interp{margin:0;color:var(--ink);font-size:13px;line-height:1.5}

/* mapa de calor en miniatura dentro de la pila de tarjetas */
.tile.hmt{--st:var(--ok);background:color-mix(in srgb,var(--ink) 4%,transparent)}
.tile.hmt.wide{grid-column:span 2;grid-row:span 2}
.mh{flex:1 1 auto;min-height:0;margin-top:6px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:2px}
.mh.big{grid-template-columns:22px repeat(7,minmax(0,1fr));gap:3px}
.mh i{display:block;border-radius:2px;min-height:3px}
.mh.big i{border-radius:3px}
.mh i.off{background:repeating-linear-gradient(135deg,var(--glass-flat) 0 2px,transparent 2px 5px)}
.mh i.pk{outline:1.5px solid var(--ok);outline-offset:1px}
.mh-h,.mh-d{font-size:9px;line-height:1;color:var(--muted);text-align:center;align-self:center;font-variant-numeric:tabular-nums}
.mh-h{text-align:right;padding-right:3px}

/* correcciones de la revisión: ventana de cada tarjeta, causa común, ficha y páginas nuevas */
.tile .t-w{font-family:var(--font);letter-spacing:0;text-transform:none;opacity:.85;white-space:nowrap}
.tile .t-h .t-id{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile .t-h .t-st{flex:none}
.tag.cc{background:color-mix(in srgb,var(--bad) 14%,transparent);color:color-mix(in srgb,var(--bad) 75%,var(--ink-strong))}
.seg-g{display:flex;gap:3px;padding:2px;margin:-2px 0;border-radius:2px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--bad) 70%,transparent)}
.seg-g i{flex:1;border-radius:2px;background:var(--c)}
.sema__c{margin:0 0 8px;font-size:12px;line-height:1.45;color:var(--ink)}
.tl em{font-style:normal;font-size:10.5px;color:var(--muted)}
.vbars{position:relative}
.vbars>div{gap:2px}
.vbars b{line-height:12px}.vbars em{line-height:14px}
.vref{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--bad);pointer-events:none;z-index:1}
.vref em{position:absolute;left:0;top:-16px;font-style:normal;font-size:10px;font-weight:600;color:color-mix(in srgb,var(--bad) 80%,var(--ink-strong));white-space:nowrap}
.fnav{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.fnav__b{appearance:none;border:0;border-radius:4px;padding:6px 10px;background:var(--glass-flat);color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fnav__b:hover{color:var(--ink-strong);background:color-mix(in srgb,var(--ink) 10%,transparent)}
.varm{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0;font-size:12px;color:var(--muted)}
.varm b{color:var(--ink-strong);font-weight:600}
.varm .up{color:color-mix(in srgb,var(--ok) 70%,var(--ink-strong))}.varm .dn{color:color-mix(in srgb,var(--bad) 75%,var(--ink-strong))}
.refx{margin:8px 0 0;font-size:12px;line-height:1.45;color:var(--muted)}.refx b{color:var(--ink);font-weight:600}
.fuente{margin-top:8px;padding:9px 12px;border-radius:4px;background:var(--glass-flat);font-size:12px;line-height:1.5;color:var(--muted)}
.cg-sub{margin:-4px 0 8px;font-size:11.5px;color:var(--muted)}
.ap-tbl td{vertical-align:middle}
.ap-tbl tr[data-id]{cursor:pointer}
.ap-tbl .fxt{margin-top:2px;font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:400}
.muted{color:var(--muted);font-size:11px}
.tspark{display:inline-block;width:84px;height:22px;vertical-align:middle}.tspark svg{width:100%;height:100%}
.lim ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.5;color:var(--ink)}
.casc{display:block;width:100%;height:180px;overflow:visible;margin-top:6px}
.casc rect.c-ini{fill:var(--chart-2)}.casc rect.c-menos{fill:color-mix(in srgb,var(--ink) 14%,transparent)}.casc rect.c-fin{fill:var(--chart)}.casc rect.c-neg{fill:var(--bad)}
.casc text{font-size:10px;font-weight:600;fill:var(--ink-strong);font-family:var(--font)}
.casc-0{stroke:var(--line);stroke-width:1}
.casc-l{display:grid;gap:4px;margin-top:4px;font-size:10.5px;line-height:1.25;color:var(--muted);text-align:center}
.gantt{position:relative;display:flex;flex-direction:column;gap:6px;--lw:150px;padding-bottom:18px}
.gt-ax,.gt-row{display:grid;grid-template-columns:var(--lw) 1fr;align-items:center;gap:10px}
.gt-ax>div{display:grid;grid-template-columns:repeat(11,1fr);font-size:10px;color:var(--muted);text-align:center}
.gt-l{font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt-tr{position:relative;height:12px;border-radius:2px;background:var(--glass-flat)}
.gt-tr i{position:absolute;top:0;bottom:0;border-radius:2px;background:var(--chart)}
.gt-tr b{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--chart)}
.gt-ln{position:absolute;top:20px;bottom:16px;left:calc(var(--lw) + 10px + (100% - var(--lw) - 10px) * var(--xn));width:0;border-left:1.5px dashed var(--bad)}
.gt-ln.real{border-left-color:var(--warn)}
.gt-ln em{position:absolute;bottom:-17px;left:4px;font-style:normal;font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap}
@media (max-width:640px){.vbars b{display:none}.vref em{font-size:9px}.gantt{--lw:96px}.fnav__b{font-size:11px}}

/* pila de tarjetas de «Datos de respaldo»: vidrio con canto, como en el simulador */
.dli{border:1px solid var(--dedge);background:color-mix(in srgb,var(--surface) 72%,transparent);box-shadow:inset 0 1px 0 var(--glass-hi),0 -10px 24px -18px var(--glass-shadow)}
.dli::before{display:none}
.dli.cur{background:color-mix(in srgb,var(--surface) 92%,transparent)}

/* ---------- piel editorial «Folio»: papel elevado con filete de 1 px, esquinas casi rectas ---------- */
.card,.side>.phead,.side>.sec,.side>.note,.side>.empty-st,.side>.dbody,.side>.cgs>.cg,.glass,.left>.sema{border:1px solid var(--line);border-radius:4px;background:var(--card-bg);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.side>.note{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.chrome{border:1px solid var(--line);border-radius:4px;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.tile{border:1px solid color-mix(in srgb,var(--st) 40%,var(--line));border-radius:4px}
.tile[data-st="na"],.tile.hmt,.tile.more{border-color:var(--line);background:var(--card-bg)}
.tile:hover{border-color:var(--ink-strong)}
.tile.big{border-color:var(--st)}
.tile .t-v{font-weight:600;letter-spacing:-.02em}
.dli{border-radius:4px;box-shadow:none;background:var(--card-bg)}
.dli:hover{border-color:var(--ink-strong)}
.dli.cur{background:var(--accent-soft);border-color:var(--accent)}
.pop,.finder{border:1px solid var(--ink-strong);border-radius:4px;background:var(--pop-bg);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 12px 32px var(--glass-shadow)}
.cg h4,.sema__t,.kind,.sec h3,.sec>h3{font-family:var(--mono);letter-spacing:.08em}
.dot{box-shadow:none}
/* selector de los 7 temas */
.temas{display:grid;gap:6px;padding:4px}
.tema{appearance:none;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink);cursor:pointer}
.tema:hover{border-color:var(--ink-strong)}
.tema[aria-checked="true"]{border-color:var(--ink-strong);box-shadow:inset 0 0 0 1px var(--ink-strong)}
.tema__sw{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;width:44px;height:30px;border:1px solid color-mix(in srgb,var(--ink-strong) 25%,transparent)}
.tema__sw i{display:block}
.tema b{display:block;font-size:13px;font-weight:600;color:var(--ink-strong)}
.tema small{display:block;font-size:11.5px;color:var(--muted);line-height:1.35}
.tema em{font-style:normal;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--accent)}
.dbody .dfit{grid-template-columns:minmax(0,1fr)}

/* tarjetas de indicador con diseño editorial: nombre y estado arriba, cifra grande y fina, nota y minigráfica abajo */
.tile:not(.big):not(.hmt):not(.more){background:var(--card-bg);border:1px solid var(--line);padding:16px 18px 14px;gap:6px;min-height:150px}
.tile:not(.big):not(.hmt):not(.more):hover{border-color:var(--ink-strong);background:var(--card-bg)}
.tile .t-lab{font-family:var(--font);font-size:14px;font-weight:500;color:var(--ink-strong);line-height:1.3;min-width:0}
.tile:not(.big) .t-h{align-items:flex-start;gap:10px}
.st-badge{flex:none;font-family:var(--mono);font-size:11.5px;font-weight:600;line-height:1;padding:5px 8px;border:1px solid currentColor;border-radius:2px;white-space:nowrap;background:var(--card-bg)}
.st-badge.ok{color:var(--ok)}.st-badge.warn{color:var(--warn)}.st-badge.bad{color:var(--bad)}
.tile:not(.big):not(.hmt):not(.more) .t-v{font-size:clamp(28px,2.4vw,38px);font-weight:300;letter-spacing:-.03em;line-height:1.05;margin-top:2px}
.tile:not(.big) .t-v.txt{font-size:22px;font-weight:300;color:var(--muted)}
.t-ft{display:grid;grid-template-columns:minmax(0,1fr) 64px;align-items:end;gap:10px;margin-top:auto}
.t-nt{font-size:12.5px;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.t-mini{display:block;align-self:center}
.t-mini svg.spark{height:24px}
.t-mini .bar{margin:0}
.bento{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile.hmt.wide{grid-row:span 2}
.tile.big{background:var(--card-bg);border:1px solid var(--ink-strong);padding:18px 20px 14px;gap:8px}
.tile.big .t-h{align-items:flex-start;gap:10px}
.tile.big .t-lab{font-size:15px}
.tile.big .t-w{color:var(--muted);font-weight:400}
.tile.big .t-v{font-size:clamp(36px,3.4vw,52px);font-weight:300;letter-spacing:-.035em;line-height:1.02}
.tile.big .t-v small{font-size:14px;font-weight:400;letter-spacing:0}
.tile.big .t-s{font-size:13px;font-weight:400;color:var(--ink);line-height:1.45}
.tile .t-lab,.t-nt{font-weight:400}
.tile.big svg.spark path[fill]{opacity:.5}
@media (max-width:640px){.bento{grid-template-columns:minmax(0,1fr)}.tile.big,.tile.hmt.wide{grid-column:auto}}
/* barra superior en la piel editorial */
.tbtn .tip{border-radius:3px;border:1px solid var(--line)}
.tbtn[aria-pressed="true"],.tbtn[aria-pressed="true"]:hover{background:var(--band);color:var(--on-band);box-shadow:none}
.top{margin:0 calc(-1*var(--gutter)) 18px;padding:10px var(--gutter);top:0;background:var(--bg)}
@media (max-width:760px){.top{margin:0 -12px 14px;padding:8px 12px}}
/* pila de datos alineada: todas las tarjetas del mismo ancho */
.dli,.dli:hover{transform:none}
@keyframes dliIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
/* interruptor con el color del tema */
.switch[aria-checked="true"]{background:var(--band)}
.switch::after{background:var(--on-band,#fff)}
/* inicio: solo las tarjetas, a todo el ancho; el semáforo vive en su menú */
.left>.sema{display:none}
.stage.solo{grid-template-columns:minmax(0,1fr)}.stage.solo .side{display:none}
.stage.solo .bento{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
/* tarjeta elegida: las demás se recogen en una franja arriba y la ficha ocupa todo el panel */
.stage.foco{grid-template-columns:minmax(0,1fr);gap:14px}
.stage.foco .left{position:sticky;top:var(--toph,64px);z-index:30;margin:0 calc(-1*var(--gutter));padding:2px var(--gutter) 10px;background:var(--bg)}
.stage.foco .bento{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}

function layoutGrid() {

    g.style.gridTemplateColumns = g.style.gridTemplateRows = g.style.gridAutoFlow = '';

    return;

  let best = null;

function drawAp(g, cv) {

// cascada: de las ventas (100 %) al resultado, restando costo de ventas y cada rubro de gasto (reparto de dic – oct)
function cascada() {
  const r = calc(PER.map(ix)), tot = D.estructura_gastos.reduce((s, g) => s + g.pct, 0);
  const pasos = [['Ventas', 100, 'ini'], ['Costo de ventas', r.CV / r.V * 100, 'menos'],
    ...D.estructura_gastos.map(g => [g.rubro.replace(/ \(.*\)/, '').replace(' y servicios bancarios', ''), g.pct / tot * r.pgo, 'menos']), ['Resultado', r.mo, 'fin']];
  let nivel = 100; const barras = pasos.map(([n, v, t]) => {
    if (t === 'ini') return [n, 0, 100, t, v];
    if (t === 'fin') return [n, Math.min(0, v), Math.max(0, v), v < 0 ? 'neg' : t, v];
    const hi = nivel; nivel -= v; return [n, nivel, hi, t, -v];
  });
  const lo = Math.min(0, ...barras.map(b => b[1])), W = 60, H = 140, T = 16, y = v => T + (100 - v) / (100 - lo) * H;
  return `<svg class="casc" viewBox="0 0 ${barras.length * W} ${H + T + 16}" preserveAspectRatio="none" role="img" aria-label="Cascada de las ventas al resultado">
    <line x1="0" x2="${barras.length * W}" y1="${y(0)}" y2="${y(0)}" class="casc-0"/>
    ${barras.map(([n, a, b, t, v], k) => `<rect class="c-${t}" x="${k * W + 8}" y="${y(b)}" width="${W - 16}" height="${Math.max(1.5, y(a) - y(b))}" rx="3"><title>${n}: ${pct(v, 2)} de las ventas</title></rect>
      <text x="${k * W + W / 2}" y="${t === 'neg' ? y(a) + 12 : y(b) - 4}" text-anchor="middle">${pct(v)}</text>`).join('')}</svg>
    <div class="casc-l" style="grid-template-columns:repeat(${barras.length},1fr)">${barras.map(b => `<span>${b[0]}</span>`).join('')}</div>`;
}

function picoMapa(M) { let pk = [0, 0]; M.forEach((r, d) => r.forEach((v, j) => { if (v != null && v > M[pk[0]][pk[1]]) pk = [d, j]; })); return pk; }
// filas = horas, columnas = días de la semana; a la derecha el total de la hora en la semana y abajo el total de cada día
function drawHeat(m) {
  const H = D.mapa, M = H[m], all = M.flat().filter(v => v != null), max = Math.max(...all);
  const fmt = v => m === 'v' ? usd(v) : nf(v, 1), cell = v => m === 'v' ? nf(v, 0) : nf(v, 1);
  const unit = m === 'v' ? 'en ventas' : 'transacciones';
  const pk = picoMapa(M);

  H.horas.forEach((h, j) => {
    html += `<span class="rl">${h}:00</span>`;

      const a = v / max, p = Math.round(8 + a * 92);

    });
    html += `<span class="tt">${fmt(M.reduce((s, r) => s + (r[j] || 0), 0))}</span>`;
  });
  html += '<span class="rl">Día</span>' + M.map(r => `<span class="tt tc">${fmt(r.reduce((s, v) => s + (v || 0), 0))}</span>`).join('') + '<span></span>';

  info.textContent = base;
  el.querySelectorAll('.c').forEach(c => {
    c.onmouseenter = () => { const d = +c.dataset.d, j = +c.dataset.j, v = M[d][j];
      info.textContent = v == null ? `${cap(DIAS_L[d])} a las ${H.horas[j]}:00: cerrado` : `${cap(DIAS_L[d])} de ${H.horas[j]}:00 a ${H.horas[j]}:59: ${fmt(v)} ${unit} · ${m === 'v' ? nf(H.t[d][j], 1) + ' transacciones' : usd(H.v[d][j]) + ' en ventas'}`; };
    c.onmouseleave = () => { info.textContent = base; };

}
document.querySelector('.top').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  ({fechas: openMes, ind: openInd, sem: openSemaforo, tema: cycleTheme, buscar: openFinder, ajustes: openAjustes})[b.dataset.act]?.();
});
addEventListener('keydown', e => {
  const typing = e.target.closest('input, textarea, select, [contenteditable="true"]');
  if (e.key === 'Escape') {
    if ($('finder').open) return;
    if (POP) { const b = POP.btn; closePop(); b.focus(); return; }
    if (S.datos) { if (S.card != null) pickCard(null); else closeDatos(); }
    else if (S.sel) pick(null);
  } else if (!typing && !e.metaKey && !e.ctrlKey && !e.altKey && (e.key === '/')) { e.preventDefault(); openFinder(); }
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openFinder(); }
});
addEventListener('resize', () => { closePop(true); document.querySelectorAll('.gb').forEach(n => slide(n, true)); });

const TEMAS = [
  {id: 'forest-ochre', n: 'Forest & Ochre', d: 'Guía de campo: verdes, ocre y óxido sobre papel avena', sw: ['#EAE6D6', '#24432E', '#2C5E3B', '#B84A24']},
  {id: 'lavender-press', n: 'Lavender Press', d: 'Lavanda y violeta con acentos bermellón', sw: ['#E8E6EF', '#6C50F6', '#7C63FF', '#E2492C']},
  {id: 'newsprint', n: 'Newsprint', d: 'Papel de periódico, tinta negra y azul de imprenta', sw: ['#F0EADB', '#1A1714', '#2C4F8C', '#B23A1E']},
  {id: 'night-edition', n: 'Night Edition', d: 'Edición nocturna: fondo oscuro y acentos claros', sw: ['#121318', '#F2B84B', '#8FA2FF', '#FF7A59']},
  {id: 'tinta', n: 'Tinta', d: 'Casi todo blanco, con grises oscuros y negro', sw: ['#FFFFFF', '#0A0A0A', '#6A6A6A', '#C9C9C9']},
  {id: 'gazette-mono', n: 'Gazette Mono', d: 'Monocromo de gaceta con un solo rojo', sw: ['#F4F4F2', '#0F0F10', '#1A1A1D', '#D92B2B']},
  {id: 'swiss-poster', n: 'Swiss Poster', d: 'Cartel suizo: azul, rojo y verde puros', sw: ['#F3EFE6', '#0046C7', '#0046C7', '#E53224']},
  {id: 'riso-pastel', n: 'Riso Pastel', d: 'Risografía: azul, rosa y verde azulado', sw: ['#F5ECEC', '#1F5B8C', '#1F5B8C', '#D94162']}
];
let theme = 'forest-ochre';
try { const g = localStorage.getItem('cuma-tema') || localStorage.getItem('cuma-theme'); theme = g === 'dark' ? 'night-edition' : TEMAS.some(t => t.id === g) ? g : theme; } catch (e) {}
const applyTheme = () => { document.documentElement.dataset.theme = theme; $('themetip').textContent = 'Tema: ' + TEMAS.find(t => t.id === theme).n; };
const repaint = () => { applyTheme(); defaults(); compute(); renderHead(); renderBento(false); if (S.datos) deckList(); renderPanel(); };
function setTheme(id) { theme = id; try { localStorage.setItem('cuma-tema', theme); } catch (e) {} repaint(); }
function cycleTheme() {
  openPop($('theme'), `<div class="pop__head">Apariencia <small>8 temas</small></div><div class="temas" role="radiogroup" aria-label="Tema de color">${TEMAS.map(t => `<button type="button" class="tema" role="radio" data-t="${t.id}" aria-checked="${t.id === theme}"><span class="tema__sw">${t.sw.map(c => `<i style="background:${c}"></i>`).join('')}</span><span><b>${t.n}</b><small>${t.d}</small></span>${t.id === theme ? '<em>ACTIVO</em>' : ''}</button>`).join('')}</div>`,
    el => el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { setTheme(b.dataset.t); closePop(); }));
}

const topH = () => document.documentElement.style.setProperty('--toph', document.querySelector('.top').offsetHeight + 'px');
addEventListener('resize', () => { topH(); layoutGrid(); });
applyTheme(); defaults(); compute(); renderHead(); renderBento(false); renderPanel(); topH();

/* entrada de la página: la barra cae con rebote, los íconos aparecen y las tarjetas se abren */
if (!reduce()) {
  [...document.querySelectorAll('.top>*')].forEach((c, i) => c.animate([{transform: 'translateY(-70px)'}, {transform: 'none'}],
    {duration: 900, delay: 20 + i * 70, easing: 'cubic-bezier(.34,1.45,.64,1)', fill: 'backwards'}));
  document.querySelectorAll('.top .tbtn, .top .brand').forEach((b, i) => b.animate([{opacity: 0, transform: 'scale(.6)'}, {opacity: 1, transform: 'none'}], {duration: 600, delay: 260 + i * 40, easing: 'cubic-bezier(.34,1.45,.64,1)', fill: 'backwards'}));
  [...$('pin').children].forEach((k, i) => reveal(k, 160 + Math.min(i, 8) * 60));
}
})();
</script>
</body>
</html>
